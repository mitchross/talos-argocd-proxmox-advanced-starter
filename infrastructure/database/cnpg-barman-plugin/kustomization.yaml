# CloudNativePG Barman Cloud Plugin
#
# Provides the `ObjectStore` CRD + a plugin sidecar/Service that the CNPG
# operator reaches via gRPC. Cluster CRs reference the plugin in their
# `spec.plugins[]` block — the plugin handles WAL archiving and base
# backups against any S3-compatible object store. Replaces the
# deprecated in-Cluster `spec.backup.barmanObjectStore` (removed in
# CNPG 1.30.0).
#
# Pinned to v0.12.0 (latest stable as of writing). Bump the URL tag to
# upgrade — Renovate will manage this in 2j's renovate.json.
#
# Why URL fetch instead of vendored manifest: upstream doesn't publish
# a Helm chart, and the raw manifest is ~1100 lines (mostly CRD OpenAPI
# schema). Pulling from the tag keeps the repo lean and is consistent
# with how Cilium / CNPG-operator are pinned (chart name + version, not
# vendored YAML).
#
# Wave: cross-Application ordering is handled by
# `infrastructure/controllers/argocd/apps/core-dependencies/cnpg-barman
# -plugin-app.yaml` (Application sync-wave 3). The internal -9 here is
# the per-resource sub-wave inside this Application.
#
# CRITICAL: the plugin MUST be installed in the same namespace as the
# CNPG operator. Plugin discovery is hard-scoped to the operator's
# OWN namespace — even with the cnpg.io/pluginName Service label set
# correctly, cross-namespace TCP connectivity working, and operator
# RBAC allowing cross-namespace secret reads, the operator silently
# fails to discover the plugin.
#
# Documented at:
#   https://cloudnative-pg.io/plugin-barman-cloud/docs/next/installation/
#   "The plugin must be installed in the same namespace as the
#    CloudNativePG operator (typically `cnpg-system`)."
#
# This was a real production issue on the source homelab cluster
# (talos-argocd-proxmox, 2026-05-07). The starter inherits the same
# requirement — the cnpg-operator in this starter lands in
# `cloudnative-pg` (see ../cloudnative-pg/cloudnative-pg-operator/),
# so the plugin MUST also land there.
#
# Solution below: kustomize `namespace:` directive + patch out the
# upstream Namespace resource (which is cluster-scoped and not affected
# by the namespace directive).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Co-locate with the CNPG operator. Plugin discovery requires same-namespace.
# See header for the full rationale + upstream doc reference.
namespace: cloudnative-pg

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-9"

resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.12.0/manifest.yaml

patches:
  # Strip the upstream Namespace resource named `cnpg-system`. The
  # cluster-scoped `kind: Namespace` is not affected by the namespace
  # directive above, so without this patch kustomize would still emit
  # an empty `cnpg-system` namespace. Co-located in cloudnative-pg
  # (created by ../cloudnative-pg/cloudnative-pg-operator/namespace.yaml).
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cnpg-system
    target:
      kind: Namespace
      name: cnpg-system
