# Base CNPG Cluster manifest — NO bootstrap stanza.
# Overlays (overlays/initdb, overlays/recovery) supply the bootstrap
# via strategic-merge patch.
#
# serverName encodes the FORWARD write target (current lineage). On
# fresh-nuke recovery, set this to the NEXT lineage so post-restore
# backups don't append to the polluted current-lineage directory on S3.
# Bump this whenever you trigger a new recovery — keep in sync with the
# recovery overlay's externalClusters (which points at the PRIOR lineage).
#
# The S3 destination and retention live on the sibling ObjectStore CR.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-database
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app: gitea
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14@sha256:d9942fd46669234d39c5e6152e23a973bd38df4d2e2eddb6b69bb71b76625ce1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_wal_size: "512MB"
      wal_compression: "on"
    pg_hba:
      - host all all 0.0.0.0/0 md5
  storage:
    size: 20Gi
    storageClass: longhorn
  walStorage:
    # WAL is a transient spool (max_wal_size < 1GiB here); 10GiB leaves ample
    # headroom without reserving a second database-sized volume.
    size: 10Gi
    storageClass: longhorn
  enableSuperuserAccess: true
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Designates this Cluster as the active WAL writer for the referenced
      # ObjectStore. Keep at most one Cluster per ObjectStore as
      # isWALArchiver=true.
      isWALArchiver: true
      parameters:
        # Name of the sibling ObjectStore CR (see base/objectstore.yaml).
        barmanObjectName: gitea-objectstore
        # Fresh installs write to v1. For the first recovery, change this to v2
        # before enabling the recovery overlay, which reads from v1.
        serverName: gitea-database-v1
