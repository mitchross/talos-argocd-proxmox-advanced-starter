# CNPG Barman ObjectStore — declares the S3 backup destination + retention
# for the gitea-database Cluster.
#
# The Cluster references this object through
# spec.plugins[0].parameters.barmanObjectName. Retention lives here too.
#
# IMPORTANT — sync-wave.
# Annotated to sync-wave -6 so it is admitted BEFORE the Cluster mod
# (commonAnnotations on the root kustomization sets the Cluster's wave to
# -5).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gitea-objectstore
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  configuration:
    # WAL and base backups share this database-specific prefix.
    destinationPath: s3://postgres-backups/cnpg/gitea
    endpointURL: http://192.168.10.133:30292
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-credentials
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "14d"
