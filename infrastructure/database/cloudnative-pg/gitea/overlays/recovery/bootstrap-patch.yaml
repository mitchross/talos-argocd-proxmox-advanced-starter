apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-database
spec:
  bootstrap:
    recovery:
      source: gitea-recovery-source
      database: gitea
      owner: gitea
      secret:
        name: gitea-app-secret
      # No recoveryTarget means recover to the latest available WAL.
  # Reuse the ObjectStore; serverName selects the prior lineage in the bucket.
  externalClusters:
    - name: gitea-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          # Same bucket, credentials, and endpoint; only the lineage changes.
          barmanObjectName: gitea-objectstore
          # First recovery reads v1 while base/cluster.yaml is bumped to v2.
          serverName: gitea-database-v1
