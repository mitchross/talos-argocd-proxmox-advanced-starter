# S3 credentials for CNPG/Barman backups.
#
# The per-database ObjectStore CRs reference `cnpg-s3-credentials` by name
# (see gitea/base/objectstore.yaml). The Secret lives here, with the operator,
# rather than in any one database directory: every CNPG database in the
# namespace backs up to the same bucket with the same workload key, so a
# per-database copy would mean two Applications owning one object —
# FailOnSharedResource territory.
#
# Same 1Password `rustfs` item that feeds the kopiur fan-out, different key
# names: Barman wants AWS_*, Kopia wants KOPIA_PASSWORD + AWS_*. See
# docs/rustfs-setup.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: cnpg-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: rustfs
        property: rustfs-workload-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: rustfs
        property: rustfs-workload-secret-key
