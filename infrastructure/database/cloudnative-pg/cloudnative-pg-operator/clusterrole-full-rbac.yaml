# Extra ClusterRole granting the CNPG operator the permissions it needs
# to fully manage Cluster lifecycles, including creating per-Cluster
# RBAC resources (rolebindings + roles for the database pods).
#
# Why hand-written instead of trusting the Helm chart's defaults:
# - The chart's default ClusterRole is intentionally narrow (read-only
#   on most resources, mutating only on its own CRDs). For
#   the in-cluster lifecycle the operator actually needs to manage
#   (per-Cluster ServiceAccounts, RoleBindings, ConfigMaps for
#   shared_preload_libraries, Events for status, etc.), additional
#   verbs are required.
# - The source cluster ships this exact same role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-operator-full-rbac
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "events", "serviceaccounts"]
    verbs: ["*"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["*"]
