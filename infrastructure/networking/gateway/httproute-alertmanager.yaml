---
# AlertManager UI exposed at alertmanager.<your-domain>.
#
# WARNING: like the Prometheus and Longhorn UIs, AlertManager has no
# auth out of the box. The UI lets anyone fire test alerts, create
# silences, and view receiver configs. LAN-only is the assumed
# deployment; layer auth-proxy or remove from kustomization.yaml if
# you need stricter access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: kube-prometheus-stack
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "alertmanager.__REPLACE_ME_DOMAIN__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          # Chart names this Service `kube-prometheus-stack-alertmanager`
          # with a named port `http-web` (9093).
          name: kube-prometheus-stack-alertmanager
          port: 9093
          weight: 1
