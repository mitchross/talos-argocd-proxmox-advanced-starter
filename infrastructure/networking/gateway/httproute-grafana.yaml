---
# Grafana UI exposed at grafana.<your-domain>.
#
# Same rationale as the other HTTPRoutes in this directory — the
# HTTPRoute lives next to the Gateway it attaches to (Wave 4) rather
# than next to the Grafana manifests (Wave 5), so the cross-namespace
# parentRef resolves cleanly without ordering concerns.
#
# Auth: Grafana ships with admin/<sealed-secret-password>; LAN-only by
# default. To layer SSO in front, see docs/extending/ for the
# oauth2-proxy recipe.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: kube-prometheus-stack
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "grafana.__REPLACE_ME_DOMAIN__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          # Service port `http-web` (80). The grafana sub-chart's Service
          # has a named port — required for HTTPRoute compatibility per
          # the repo CLAUDE.md "name: http or it silently fails" rule.
          port: 80
          weight: 1
