---
# ArgoCD UI exposed at argocd.<your-domain>.
#
# Lives in the gateway/ directory (not infrastructure/controllers/argocd/)
# because including it at Wave 0 alongside the argocd Helm install would
# deadlock the bootstrap: HTTPRoute requires a Gateway that doesn't
# exist until Wave 4 (cilium gateway-class is at W0, but the gateway-
# internal Gateway resource itself is at W4 with this directory). The
# HTTPRoute would stay Progressing forever, blocking subsequent waves.
#
# By placing this HTTPRoute in the gateway/ directory, it deploys at the
# same wave as the Gateway it references — clean ordering, no deadlock.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "argocd.__REPLACE_ME_DOMAIN__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          # Service port `http` (80). The argocd Helm chart names it
          # — important for HTTPRoute compatibility, since unnamed
          # ports silently fail attachment.
          port: 80
          weight: 1
