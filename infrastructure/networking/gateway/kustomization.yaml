apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wave 4 — discovered by the infrastructure ApplicationSet.
# Order within this directory:
#   ns.yaml              gateway namespace
#   gw-internal.yaml     internal Gateway (the actual API resource)
#   httproute-*.yaml     each app's HTTPRoute attaches to the Gateway
#                        above. Adding more HTTPRoutes here is the
#                        idiomatic way to expose new in-cluster UIs.
#
# Demo apps under apps/ ship their own HTTPRoutes alongside their
# manifests — they're discovered by the apps ApplicationSet at Wave 6,
# but they reference this Gateway from there.
resources:
  - ns.yaml
  - gw-internal.yaml
  - httproute-argocd.yaml
  - httproute-longhorn.yaml
  # Monitoring HTTPRoutes live here (not in monitoring/) for the same
  # reason as httproute-argocd.yaml: the HTTPRoute references the
  # Wave-4 Gateway, and putting it in the Wave-5 monitoring directory
  # means a stuck Progressing state until W4 catches up. Same wave as
  # the Gateway = clean.
  - httproute-grafana.yaml
  - httproute-prometheus.yaml
  - httproute-alertmanager.yaml
  - httproute-loki.yaml

generatorOptions:
  disableNameSuffixHash: true
