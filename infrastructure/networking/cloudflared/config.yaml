tunnel: threadripper
protocol: http2
credentials-file: /etc/cloudflared/credentials/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true
loglevel: info
ingress:
  # Only labeled external HTTPRoutes receive Cloudflare DNS records; the
  # Gateway still enforces each route's exact hostname.
  - hostname: "*.vanillax.xyz"
    service: https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443
    originRequest:
      noTLSVerify: true
      originServerName: "*.vanillax.xyz"
  - service: http_status:404
