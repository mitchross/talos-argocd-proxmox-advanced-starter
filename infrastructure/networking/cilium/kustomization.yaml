apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubePrism (localhost:7445) handles control-plane HA via Omni's
# SideroLink — no external LB resource needed for the API server.
# The LoadBalancer IPPool + L2 policy are for application Services only.
#
# Both ip-pool.yaml and l2-policy.yaml carry sync-wave: "1" so they
# apply AFTER cilium core is healthy at wave 0; their CRDs ship with
# the chart, and the LB IPAM controller comes up with cilium-operator.
resources:
  - ip-pool.yaml
  - l2-policy.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.19.3
    releaseName: cilium
    includeCRDs: true
    namespace: kube-system
    valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true
