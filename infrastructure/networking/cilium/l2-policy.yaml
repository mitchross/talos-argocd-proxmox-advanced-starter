---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
  namespace: kube-system
  annotations:
    # Apply AFTER Cilium core is running to prevent announcement disruption
    argocd.argoproj.io/sync-wave: "1"
    # Prevent unnecessary syncs that disrupt L2 announcements
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  # CRITICAL: Enable L2 announcements for LoadBalancer IPs
  loadBalancerIPs: true

  # Announce LoadBalancer IPs on conventional Ethernet interface names.
  # This covers Proxmox/Talos names such as eth0, ens18, and enp6s18.
  interfaces:
    - ^(eth|ens|enp)[a-z0-9]+$


  # Announce for all LoadBalancer services
  serviceSelector:
    matchLabels: {}

  # Any worker may hold an L2 lease. Add a label selector here if only selected
  # nodes are physically connected to the LoadBalancer subnet.
  nodeSelector:
    matchLabels: {}
    matchExpressions: []
