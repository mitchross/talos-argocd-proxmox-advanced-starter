# Longhorn post-install Settings (CRD-managed).
#
# values.yaml's `defaultSettings:` block only seeds on FIRST install —
# longhorn-manager reconciles these via the Setting CRD afterwards, so
# any value we want to be authoritative long-term has to live as a
# Setting resource here. Otherwise the manager silently reverts our
# chart values.
#
# These settings collectively make node failure recoverable without
# manual intervention. The default chart leaves several of them set to
# "do-nothing" or conservative values that produce stuck PVCs / stale
# attachments when a node disappears.

---
# When a node goes Unhealthy, automatically delete pods using its
# Longhorn volumes so the workload can be rescheduled and the volume
# reattached on a surviving replica. The chart default (`do-nothing`)
# leaves volumes faulted indefinitely.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "delete-both-statefulset-and-deployment-pod"

---
# Reap orphaned replica data + instance runtime when all replicas of a
# volume are lost. Prevents PVCs from getting stuck in Terminating.
# Format: semicolon-separated. Valid types:
#   replica-data — on-disk replica blobs
#   instance     — engine and replica process runtime
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: orphan-resource-auto-deletion
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "replica-data;instance"

---
# Block node drain if it would leave a volume with zero healthy
# replicas. The default (`block-if-contains-last-replica`) is correct
# but pin it explicitly so an upgrade can't change it under us.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-drain-policy
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "block-if-contains-last-replica"

---
# Reserve 25% of each disk for filesystem overhead and growth headroom.
# The chart default (10%) is too tight on small homelab disks: under
# pressure Longhorn refuses to provision new volumes with cryptic
# "insufficient storage" errors before the disk is actually full.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: storage-reserved-percentage-for-default-disk
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "25"

---
# Pin fast replica rebuild on (also seeded in values.yaml; pinning here
# defends against the manager reverting it post-install).
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: fast-replica-rebuild-enabled
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "true"

---
# How many replicas a single node can rebuild concurrently. 5 is a fine
# default; bigger clusters with faster disks can go higher.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-replica-rebuild-per-node-limit
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "5"

---
# Don't place new replicas on a cordoned node. Standard SRE behavior;
# the default is true but pinning defends against drift.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: disable-scheduling-on-cordoned-node
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "true"

---
# Auto-delete pods stuck on volumes that detached unexpectedly. Speeds
# up recovery from node failure — without this, kubelet keeps trying
# to reconcile a pod against a volume that's no longer attached.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: auto-delete-pod-when-volume-detached-unexpectedly
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: "true"
