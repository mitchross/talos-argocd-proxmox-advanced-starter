apiVersion: v1
kind: Namespace
metadata:
  name: volsync-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    # VolSync's mover Jobs (Kopia, restic, rsync, syncthing) need
    # hostPath / privileged access in some configurations; pin to
    # `privileged` to match the source cluster convention.
    pod-security.kubernetes.io/enforce: privileged
