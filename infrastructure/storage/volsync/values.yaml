# VolSync Helm values.
#
# Using the perfectra1n fork: https://github.com/perfectra1n/volsync
# Reason: pvc-plumber / Kopia integration. Upstream VolSync ships the
# rsync / restic / syncthing movers but not Kopia. perfectra1n's fork
# adds the Kopia mover which is what the pvc-plumber operator drives
# (see infrastructure/controllers/pvc-plumber/).
#
# CHART/IMAGE VERSION MISMATCH (intentional):
#   - kustomization.yaml pins chart 0.18.5 → templates + CRDs come
#     from 0.18.x
#   - this file pins controller + mover images to v0.17.11 → upstream
#     perfectra1n image tag for the latest tested Kopia mover binary
#
# The 0.18.x chart is template-compatible with the 0.17.11 controller
# for everything we use (ReplicationSource/Destination spec, mover Job
# templates, NFS injection, Kopia config). The mismatch exists because
# perfectra1n cuts chart releases on a different cadence than image
# releases.
#
# When upgrading: align chart and image to the same upstream tag
# first. If they only release out of step, verify the spec fields used
# by pvc-plumber's reconciler haven't changed, then bump both pins.

# perfectra1n image — bundles upstream VolSync controller + Kopia mover.
# SHA digest pin lives in the Kustomize `images:` block in
# kustomization.yaml (always-pin-sha rule, see .claude/rules/). The
# VolSync chart's image schema doesn't expose a `digest:` field on this
# struct, so the digest rides on Kustomize's image transformer.
# Renovate tracks tag + digest in lockstep there.
image: &image
  repository: ghcr.io/perfectra1n/volsync
  tag: v0.17.11

# Pin ALL mover images to the same tag — eliminates "which mover am I
# running?" mystery and keeps image pulls coherent.
kopia: *image
rclone: *image
restic: *image
rsync: *image
rsync-tls: *image
syncthing: *image

metrics:
  # No auth on /metrics — relies on NetworkPolicy + the ServiceMonitor
  # only being scraped from the prometheus-stack namespace. Acceptable
  # for an in-cluster starter; document `disableAuth: false` + a
  # bearer-token recipe under docs/extending/ if exposing metrics
  # outside the cluster.
  disableAuth: true

# Controller resource requests / limits. Sized for a homelab footprint;
# on bigger clusters with many ReplicationSources running concurrently
# the controller can use more CPU during reconcile bursts.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Let VolSync own its own CRDs (instead of installing CRDs separately).
# Required for the chart's CRD upgrade machinery to work.
manageCRDs: true

# Pod-level security context for the controller pod itself. Mover Jobs
# spawned by ReplicationSource / ReplicationDestination resources have
# their own security contexts derived from the source PVC's pod
# template — this only governs the controller.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
