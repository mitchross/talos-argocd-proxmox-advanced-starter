---
# ExternalSecret for the kopia-maintenance CronJob.
#
# Mirrors the architecture used in
# `infrastructure/controllers/pvc-plumber/externalsecret.yaml`: pulls
# from the ClusterSecretStore named `1password` (which uses the
# kubernetes provider in this starter, NOT actual 1Password — see
# infrastructure/controllers/external-secrets/cluster-secret-store.yaml
# for why the name is fixed). The provider reads `Secret/rustfs` in
# volsync-system, which the sealed-secrets controller unwraps from
# the architect's committed sealed-kopia-password.yaml.
#
# Why a separate ExternalSecret instead of reusing pvc-plumber's
# `pvc-plumber-kopia` Secret? Decoupling. The maintenance CronJob is
# part of the volsync component, not pvc-plumber — and a future
# refactor that makes pvc-plumber an optional add-on (or replaces it
# with a different orchestrator) shouldn't break repo maintenance.
# The ExternalSecret here templates `Secret/kopia-maintenance` in
# volsync-system; the CronJob references that Secret by name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopia-maintenance
  namespace: volsync-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # Hardcoded name — see cluster-secret-store.yaml header for why.
    name: 1password
  target:
    name: kopia-maintenance
    creationPolicy: Owner
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        # Same backing secret as the operator pod's password — must
        # match or the maintenance client will fail to open the
        # repository (Kopia uses the password to derive the key that
        # decrypts repo metadata).
        key: rustfs
        property: kopia_password
