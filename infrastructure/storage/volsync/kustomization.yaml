apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: volsync-system

# All resources in this directory must be listed below — kustomize
# silently ignores files not declared here, and ArgoCD won't notice.
resources:
  - namespace.yaml
  - volumesnapshotclass.yaml
  - externalsecret.yaml
  - kopia-maintenance-cronjob.yaml

helmCharts:
  - name: volsync
    repo: https://perfectra1n.github.io/volsync/charts
    # Pinned. See values.yaml header for the chart-vs-image version
    # mismatch rationale — bump both pins together when upgrading.
    version: 0.18.5
    releaseName: volsync
    namespace: volsync-system
    valuesFile: values.yaml
    includeCRDs: true
