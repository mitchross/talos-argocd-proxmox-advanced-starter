apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: volsync-system

# All resources in this directory must be listed below — kustomize
# silently ignores files not declared here, and ArgoCD won't notice.
#
# Note: there's no standalone ExternalSecret for kopia maintenance —
# the kopia-maintenance CronJob (kopia-maintenance-cronjob.yaml) reads
# directly from `Secret/pvc-plumber-kopia` in volsync-system (rendered
# by the ExternalSecret in `infrastructure/controllers/pvc-plumber/`).
# Pre-v3.1 the maintenance Job used its own ExternalSecret + Secret;
# the v3.1 lazy-credentials cutover means both the operator pod and
# the maintenance Job consume the same three-key Secret, which keeps
# the credential surface auditable in one place.
resources:
  - namespace.yaml
  - volumesnapshotclass.yaml
  - kopia-maintenance-cronjob.yaml

helmCharts:
  - name: volsync
    repo: https://perfectra1n.github.io/volsync/charts
    # Pinned. See values.yaml header for the chart-vs-image version
    # mismatch rationale — bump both pins together when upgrading.
    version: 0.18.5
    releaseName: volsync
    namespace: volsync-system
    valuesFile: values.yaml
    includeCRDs: true

# SHA digest pin (always-pin-sha rule, see .claude/rules/).
# The chart's image: struct doesn't expose `digest:`, so the digest
# rides on the Kustomize image transformer here. Renovate tracks tag +
# digest in lockstep. The transformer matches the controller and all
# mover variants (kopia/rclone/restic/rsync/rsync-tls/syncthing) since
# they all reference the same repository in values.yaml.
images:
  - name: ghcr.io/perfectra1n/volsync
    newName: ghcr.io/perfectra1n/volsync
    newTag: v0.17.11
    digest: sha256:79674d3c48685e21cadaac8e0afd14268130a0a51a10c41a9dd65096c1434a0f
