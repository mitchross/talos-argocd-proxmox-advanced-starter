# Kopia repository maintenance — consolidates index blobs, GCs
# unreachable content, and keeps repo metadata fast.
#
# Why this exists: VolSync mover pods have ephemeral hostnames, but
# Kopia records owner identity in repo config and refuses maintenance
# from clients with a different identity. This CronJob runs with a
# stable synthetic identity (`maintenance@cluster`) and claims
# ownership idempotently on every run.
#
# Schedule: 03:37 daily (off the top of the hour to avoid colliding
# with hourly backup jobs). Quick maintenance runs every day; Kopia
# internally schedules full maintenance weekly per the policy below.
#
# Backend: S3 (kopia v3.1.0 alignment with the pvc-plumber operator).
# Pre-v3.0 the repo lived on an NFS share and this CronJob mounted it
# via a legacy `nfs:` volume + `kopia repository connect filesystem`.
# v3.0 cut over to S3 — mover Jobs need no shared volume, JobMutator
# is gone, and this maintenance Job connects via `kopia repository
# connect s3` against the same bucket the operator uses.
#
# Sourcing the password + S3 creds: `Secret/pvc-plumber-kopia` is
# rendered by the ExternalSecret in the pvc-plumber directory (see
# `infrastructure/controllers/pvc-plumber/externalsecret.yaml`). Its
# three keys (KOPIA_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# are mounted as files at /var/secret/pvc-plumber-kopia and read at
# runtime — same lazy-credentials pattern the v3.1.0 operator uses
# (CHANGELOG [3.1.0]). This CronJob doesn't strictly need the lazy
# pattern (a once-a-day Job doesn't race ArgoCD startup the way the
# operator pod did), but mirroring the operator's mount layout keeps
# the Secret-shape contract single-sourced — operators reading either
# manifest see the same three files in the same path.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopia-maintenance
  namespace: volsync-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: kopia-maintenance
    app.kubernetes.io/component: backup-maintenance
spec:
  # Daily at 03:37 UTC — intentionally off the top of the hour so it
  # does not start at the same minute as generated hourly VolSync
  # backup jobs.
  schedule: "37 3 * * *"
  timeZone: "Etc/UTC"
  # Kopia maintenance holds a repo lock — no overlap.
  concurrencyPolicy: Forbid
  # Skip run if missed by >1h (don't backfill forever).
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hard cap: 2h. Full maintenance on large repos can take 30-60m.
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kopia-maintenance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kopia
              # Pin to a specific Kopia version. Must be compatible with
              # VolSync mover's Kopia version (VolSync 0.18.x ships
              # kopia ~0.20). SHA digest pin (always-pin-sha rule, see
              # .claude/rules/). Renovate tracks tag + digest in lockstep.
              image: kopia/kopia:0.22.3@sha256:4dcc208c1b191770bf4d0854f8deec06b4a16b35be4b63abdcfa9755cee7960e
              imagePullPolicy: IfNotPresent
              env:
                # ─────────────────────────────────────────────────────
                # PLACEHOLDER — replace before bootstrap completes.
                #
                # Same S3 endpoint + bucket as the pvc-plumber
                # operator's deployment (deployment.yaml in
                # ../../controllers/pvc-plumber/). The maintenance Job
                # connects to the same Kopia repo blobs the mover Jobs
                # write to. scripts/adapt-to-your-cluster.sh substitutes
                # the `__REPLACE_ME_*__` tokens at adoption time.
                # ─────────────────────────────────────────────────────
                - name: KOPIA_S3_ENDPOINT
                  value: "__REPLACE_ME_S3_ENDPOINT__:__REPLACE_ME_S3_PORT__"
                - name: KOPIA_S3_BUCKET
                  # Default bucket name — must match the operator's
                  # KOPIA_S3_BUCKET in deployment.yaml.
                  value: "volsync-kopia"
                - name: KOPIA_S3_DISABLE_TLS
                  # "true" for plaintext HTTP (typical in-cluster
                  # MinIO/RustFS without TLS termination). Flip to
                  # "false" if your S3 endpoint is fronted with TLS.
                  value: "true"
                # Stable synthetic identity — independent of pod
                # name / VolSync mover churn. Kopia records
                # `<username>@<hostname>` in repo config as the
                # maintenance owner.
                - name: KOPIA_OVERRIDE_USERNAME
                  value: "maintenance"
                - name: KOPIA_OVERRIDE_HOSTNAME
                  value: "cluster"
                - name: KOPIA_CONFIG_PATH
                  value: "/tmp/kopia/repository.config"
                - name: KOPIA_LOG_DIR
                  value: "/tmp/kopia/logs"
                - name: KOPIA_CACHE_DIRECTORY
                  value: "/tmp/kopia/cache"
                - name: HOME
                  value: "/tmp"
                # Kopia's static-build binary can't resolve the
                # current user via NSS (no CGO), so it falls back to
                # $USER — must be set or kopia aborts with:
                #   "Cannot determine current user: user: Current
                #   requires cgo or $USER set in environment"
                - name: USER
                  value: "maintenance"
                # Go's user.Current() falls back to USER *or* LOGNAME
                # when built without cgo — set both for safety.
                - name: LOGNAME
                  value: "maintenance"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  # 4Gi: `kopia maintenance run --full` loads blob
                  # indexes into memory. 2Gi was enough for small
                  # repos but the kopia repo can grow over time and
                  # the job can OOM silently before printing anything
                  # useful. 4Gi gives headroom.
                  memory: 4Gi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Read credentials lazily from the mounted Secret
                  # directory. The operator deployment uses the same
                  # mount path; keeping this CronJob in sync means a
                  # `kubectl describe secret pvc-plumber-kopia -n
                  # volsync-system` is the single source of truth for
                  # what the maintenance pipeline expects.
                  CREDS_DIR=/var/secret/pvc-plumber-kopia
                  if [ ! -s "$CREDS_DIR/KOPIA_PASSWORD" ] || \
                     [ ! -s "$CREDS_DIR/AWS_ACCESS_KEY_ID" ] || \
                     [ ! -s "$CREDS_DIR/AWS_SECRET_ACCESS_KEY" ]; then
                    echo "ERROR: Secret/pvc-plumber-kopia not fully populated."
                    echo "  Expected files in $CREDS_DIR:"
                    echo "    - KOPIA_PASSWORD"
                    echo "    - AWS_ACCESS_KEY_ID"
                    echo "    - AWS_SECRET_ACCESS_KEY"
                    echo "  Confirm ESO has rendered the Secret and"
                    echo "  the SealedSecret-unwrapped 'rustfs' Secret"
                    echo "  in volsync-system has all three properties."
                    exit 1
                  fi
                  KOPIA_PASSWORD="$(cat "$CREDS_DIR/KOPIA_PASSWORD")"
                  AWS_ACCESS_KEY_ID="$(cat "$CREDS_DIR/AWS_ACCESS_KEY_ID")"
                  AWS_SECRET_ACCESS_KEY="$(cat "$CREDS_DIR/AWS_SECRET_ACCESS_KEY")"
                  export KOPIA_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

                  echo "=== Connecting to Kopia repository (S3) ==="
                  # Kopia 0.20+ ignores KOPIA_OVERRIDE_HOSTNAME env —
                  # only the `--override-hostname` flag on
                  # `repository connect` actually sets the client
                  # identity. Without it, the pod hostname is used
                  # and `kopia maintenance run` errors with:
                  #   "maintenance must be run by designated user:
                  #    maintenance@cluster"
                  # because the owner stored on the repo
                  # (maintenance@cluster) doesn't match the client
                  # identity (maintenance@<pod-name>).
                  #
                  # `--disable-tls` aligns with the operator's
                  # KOPIA_S3_DISABLE_TLS=true. Flip BOTH together if
                  # your S3 endpoint moves behind TLS termination.
                  kopia repository connect s3 \
                    --endpoint="$KOPIA_S3_ENDPOINT" \
                    --bucket="$KOPIA_S3_BUCKET" \
                    --disable-tls \
                    --password="$KOPIA_PASSWORD" \
                    --override-hostname=cluster \
                    --override-username=maintenance

                  echo "=== Current maintenance policy ==="
                  kopia maintenance info || true

                  echo "=== Claiming ownership (idempotent) ==="
                  # Safe: --owner matches our resolved identity
                  # ($KOPIA_OVERRIDE_USERNAME@$KOPIA_OVERRIDE_HOSTNAME).
                  # Kopia validates that --owner matches the running
                  # client's identity before accepting the change.
                  kopia maintenance set \
                    --owner="maintenance@cluster"

                  # Schedule internal maintenance cadences. Note:
                  # flags are --quick-interval / --full-interval,
                  # NOT --*-maintenance-interval.
                  kopia maintenance set \
                    --quick-interval=24h \
                    --full-interval=168h

                  echo "=== Running maintenance ==="
                  # Kopia decides quick vs full internally based on
                  # the policy above. No --safety=none for recurring
                  # GitOps maintenance — unsafe GC belongs in a
                  # manual break-glass operation only.
                  kopia maintenance run

                  echo "=== Post-maintenance index blob count ==="
                  kopia repository status --json | grep -i blob || true

                  echo "=== Done ==="
              volumeMounts:
                - name: kopia-credentials
                  mountPath: /var/secret/pvc-plumber-kopia
                  readOnly: true
                - name: kopia-tmp
                  mountPath: /tmp/kopia
          volumes:
            # Lazy-credentials mount — same pattern as the operator
            # Deployment in ../../controllers/pvc-plumber/. The
            # `pvc-plumber-kopia` Secret's three keys
            # (KOPIA_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
            # are exposed as files at /var/secret/pvc-plumber-kopia.
            - name: kopia-credentials
              secret:
                secretName: pvc-plumber-kopia
                # 0440 = readable by the kopia container's UID/GID
                # (568) and the runtime's group; nothing else.
                defaultMode: 0440
            - name: kopia-tmp
              emptyDir: {}
