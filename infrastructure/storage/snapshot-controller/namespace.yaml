apiVersion: v1
kind: Namespace
metadata:
  name: snapshot-controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    # snapshot-controller itself doesn't need privileged, but matches
    # the source cluster convention so PSA labels don't drift between
    # storage namespaces.
    pod-security.kubernetes.io/enforce: privileged
