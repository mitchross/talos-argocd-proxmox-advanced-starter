apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapshot-controller

resources:
  - namespace.yaml

helmCharts:
  - name: snapshot-controller
    repo: https://piraeus.io/helm-charts/
    # Pinned. Renovate gates major bumps. CRDs in the snapshot.storage.k8s.io
    # API group are versioned independently of the controller — bump
    # carefully and test against the Longhorn version in
    # ../longhorn/kustomization.yaml.
    version: 5.0.3
    releaseName: snapshot-controller
    namespace: snapshot-controller
    valuesFile: values.yaml
    includeCRDs: true
