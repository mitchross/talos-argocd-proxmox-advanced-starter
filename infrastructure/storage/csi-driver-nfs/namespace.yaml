apiVersion: v1
kind: Namespace
metadata:
  name: csi-driver-nfs
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    # NFS CSI node DaemonSet pods need privileged + hostPath to mount
    # NFS shares into the kubelet's plugin directory. PSA `privileged`
    # is the documented requirement.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
