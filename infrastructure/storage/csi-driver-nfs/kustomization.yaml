apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: csi-driver-nfs

resources:
  - namespace.yaml
  - storage-class.yaml

helmCharts:
  - name: csi-driver-nfs
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    # Pinned. Renovate gates major bumps; the chart and the in-tree
    # NFS provisioner version are decoupled so verify the kubelet
    # plugin compatibility before bumping.
    version: 4.13.2
    releaseName: csi-driver-nfs
    namespace: csi-driver-nfs
    valuesFile: values.yaml
    includeCRDs: true
