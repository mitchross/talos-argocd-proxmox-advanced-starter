apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: 1passwordconnect
    # Bootstrap creates this Secret before ESO exists. Merge lets ESO rotate
    # the token afterward without deleting the bootstrap object.
    creationPolicy: Merge
  data:
    - secretKey: token
      remoteRef:
        key: external-secrets
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
