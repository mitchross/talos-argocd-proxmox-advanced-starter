---
# ClusterSecretStore for the kopia repository password.
#
# The name `1password` is NOT a typo — the pvc-plumber operator (image
# 2.0.0-rc1) hardcodes `secretStoreRef.name = "1password"` in the
# ExternalSecret resources it generates per backup-labeled PVC. To
# satisfy that contract without modifying the operator binary, our
# ClusterSecretStore must be named exactly `1password`. The provider
# stanza below is what actually controls where the secret comes from —
# in this starter, it's a plain Kubernetes Secret in volsync-system,
# unwrapped from a committed SealedSecret.
#
# To swap to a real backend (1Password, HashiCorp Vault, AWS Secrets
# Manager, GCP Secret Manager, Azure Key Vault, Akeyless, etc.):
#   1. Replace the `kubernetes:` block below with the matching provider
#      stanza for your backend (see https://external-secrets.io/latest/
#      provider/<your-backend>/).
#   2. Make sure the secret in your backend has a key matching what the
#      operator hardcodes — `remoteRef.key=rustfs`,
#      `remoteRef.property=kopia_password` for the kubernetes provider
#      means a Secret named `rustfs` with key `kopia_password`. For
#      1Password it would be vault item `rustfs` with field
#      `kopia_password`. The operator's hardcoded ref shape determines
#      what your backend secret needs to look like.
#   3. You can delete `infrastructure/controllers/pvc-plumber/sealed-
#      kopia-password.yaml` once your real backend is wired.
# See docs/extending/swapping-secret-backend.md for the worked recipe.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: 1password
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # ESO's CRD validation can flake on first apply if the provider isn't
    # yet running; SkipDryRunOnMissingResource lets ArgoCD push past it.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      # Read from volsync-system, where the SealedSecret-unwrapped
      # `rustfs` Secret lives. RBAC for this is in eso-rbac.yaml.
      remoteNamespace: volsync-system
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
      server:
        # In-cluster — omit the URL. caProvider points at the
        # auto-injected kube-root-ca configmap.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
