apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

resources:
  - ns.yaml
  - eso-rbac.yaml
  - cluster-secret-store.yaml

# Pinned ESO chart. Renovate bumps this through 2j's renovate.json — never
# float; chart bumps for security-critical infra need explicit review.
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.4.1
    releaseName: external-secrets
    valuesFile: values.yaml
    includeCRDs: true

# ESO 2.4.x ships large CRDs (~620KB combined) that exceed the 256KB cap
# on `kubectl.kubernetes.io/last-applied-configuration` if ArgoCD ever
# falls back to client-side apply. The Application-level
# `ServerSideApply=true` syncOption usually carries through, but
# resource-level annotations belt-and-brace it. Field-manager migration
# from client-side ownership is documented as brittle in argo-cd#11269.
patches:
  - patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: externalsecrets.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: clustersecretstores.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: secretstores.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: clusterexternalsecrets.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: pushsecrets.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: clusterpushsecrets.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
