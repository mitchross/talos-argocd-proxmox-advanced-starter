# Minimal Helm values for External Secrets Operator (ESO).
#
# replicaCount: 1 — fine for starter; bump to 2 for HA when you scale up.
# certController/webhook: disabled — the kubernetes-provider path doesn't
# need them, and they add controllers we don't use. Re-enable if you swap
# providers and need conversion webhooks.
replicaCount: 1
serviceAccount:
  create: true
  # Match what cluster-secret-store.yaml's auth.serviceAccount references.
  name: external-secrets
certController:
  create: false
webhook:
  create: false
