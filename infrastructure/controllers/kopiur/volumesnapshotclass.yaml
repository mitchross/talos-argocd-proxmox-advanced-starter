---
# Default cluster VolumeSnapshotClass for Longhorn CSI snapshots. kopiur's
# copyMethod=Snapshot references this (volumeSnapshotClassName: longhorn-snapclass).
# Cluster-default CSI snapshot class —
# every kopiur backup (copyMethod: Snapshot) depends on it.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-snapclass
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
