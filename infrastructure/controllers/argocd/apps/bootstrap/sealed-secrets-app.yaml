# Sealed-secrets — the starter's default secret backend. SealedSecret CRs
# are committed to Git (encrypted with the cluster's public key); the
# controller in this Application unwraps them into native Kubernetes
# Secrets.
#
# Why this lives at Wave 0: the pvc-plumber operator at Wave 1 needs the
# Kopia-repository password as a Secret. That Secret is sealed in
# infrastructure/controllers/pvc-plumber/sealed-kopia-password.yaml.
# Without the controller running, the SealedSecret never unseals and
# pvc-plumber crashloops on missing env.
#
# To swap to External Secrets Operator (ESO) backed by 1Password, Vault,
# AWS Secrets Manager, or any other backend, see
# docs/extending/swapping-secret-backend.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/sealed-secrets
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  source:
    repoURL: __REPLACE_ME_GIT_REPO_URL__
    targetRevision: __REPLACE_ME_GIT_BRANCH__
    path: infrastructure/controllers/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
