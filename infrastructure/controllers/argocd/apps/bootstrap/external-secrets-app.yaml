# External Secrets Operator (ESO) — bridge between the source-of-truth
# secret (a SealedSecret-unwrapped Secret in volsync-system) and the
# per-app-namespace Secrets the pvc-plumber operator templates via
# ExternalSecret CRs.
#
# Why both ESO and sealed-secrets?
# pvc-plumber rc1's PVC reconciler unconditionally creates ExternalSecret
# resources in app namespaces. Without ESO running, those CRs never
# resolve into Secrets, VolSync mover Jobs can't mount them, and backups
# silently no-op. ESO is the bridge; sealed-secrets is the GitOps-friendly
# source of truth for the master kopia password.
#
# To swap ESO's *backend* (sealed-secrets-as-source → 1Password / Vault /
# AWS-SM / etc.), edit `infrastructure/controllers/external-secrets/
# cluster-secret-store.yaml` — the provider stanza is the only piece that
# changes. See docs/extending/swapping-secret-backend.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/external-secrets
  labels:
    app.kubernetes.io/part-of: infrastructure
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: __REPLACE_ME_GIT_REPO_URL__
    targetRevision: __REPLACE_ME_GIT_BRANCH__
    path: infrastructure/controllers/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
