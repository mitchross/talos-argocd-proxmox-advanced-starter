# Self-managed argo-cd Application. After bootstrap, ArgoCD takes over its
# own configuration — chart upgrades, values changes, RBAC tweaks all flow
# through Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: __REPLACE_ME_GIT_REPO_URL__
    targetRevision: __REPLACE_ME_GIT_BRANCH__
    path: infrastructure/controllers/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Don't prune ArgoCD itself — too easy to footgun your way into a
      # cluster with no GitOps controller.
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      # Bounded retry — same rationale as root.yaml. The argo-cd chart's
      # PreSync/PostSync hooks (e.g. redis-secret-init) can complete-then-
      # delete in ways the controller's operationState mis-tracks; an
      # infinite limit wedges the entire app-of-apps tree behind a stale
      # snapshot.
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    # ArgoCD sets replicas based on chart values; if you scale via
    # `kubectl scale` (e.g. during incident response), don't fight it.
    - /spec/replicas
