apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  # Strict Go templates fail generation instead of silently producing an
  # Application with an empty name, namespace, or source path.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox-advanced-starter.git
      revision: main
      directories:
      # Directory = Application: my-apps/<category>/<app> is auto-discovered.
      - path: my-apps/*/*
      # Shared Kustomize Components render no objects on their own. Excluding
      # them prevents phantom Synced/Healthy zero-resource Applications.
      - path: my-apps/common/*
        exclude: true
  template:
    metadata:
      name: 'my-apps-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "6"
    spec:
      project: my-apps
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox-advanced-starter.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving
          # PreSync hook can wedge the entire app-of-apps behind a stale
          # manifest snapshot (incidents 2026-04-20, 2026-05-01). selfHeal: true
          # kicks a fresh sync against current git on the next reconcile.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      # HTTPRoute, ExternalSecret, and PVC restore diff noise is ignored globally.
      # App-level PVC ignores are still required because
      # RespectIgnoreDifferences=true only strips app ignore rules during sync;
      # otherwise immutable restore fields keep retrying forever on Bound PVCs.
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
      # imagePullPolicy may differ from Git due to previous Kyverno admission mutation
      - group: apps
        kind: StatefulSet
        jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.initContainers[].imagePullPolicy
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
      # kopiur controller defaults these spec fields after apply → cosmetic
      # OutOfSync on every backed-up app. Ignore only the defaulted fields.
      - group: kopiur.home-operations.com
        kind: SnapshotPolicy
        jsonPointers:
        - /spec/defaultDeletionPolicy
        - /spec/groupBy
        jqPathExpressions:
        - .spec.sources[].sourcePathStrategy

      info:
      - name: 'Description'
        value: 'Application: {{ .path.basename }}'
