# Monitoring ApplicationSet — wave 5. Discovers `monitoring/*` (one level
# deep) and creates one Application per stack. Default starter ships:
#   - monitoring/kube-prometheus-stack/  (Prometheus + Grafana + AlertManager)
#   - monitoring/loki-stack/             (Loki + Promtail)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  generators:
  - git:
      repoURL: __REPLACE_ME_GIT_REPO_URL__
      revision: __REPLACE_ME_GIT_BRANCH__
      directories:
      - path: monitoring/*
  template:
    metadata:
      name: 'monitoring-{{path.basename}}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{path}}'
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: monitoring
      revisionHistoryLimit: 3
      source:
        repoURL: __REPLACE_ME_GIT_REPO_URL__
        targetRevision: __REPLACE_ME_GIT_BRANCH__
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - Replace=false
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      info:
      - name: 'Description'
        value: 'Monitoring component: {{path.basename}}'
