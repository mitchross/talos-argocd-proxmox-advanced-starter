apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ==========================================================================
  # Wave 0 — projects + bootstrap entrypoints
  # ==========================================================================
  - projects.yaml
  - bootstrap/argocd.yaml
  - bootstrap/cilium-app.yaml
  - bootstrap/sealed-secrets-app.yaml

  # ==========================================================================
  # Wave 1 — core storage + backup infra (standalone, NOT via AppSet, so
  # they're guaranteed to run before the wave-2 webhook configs and the
  # wave-4+ AppSets).
  # ==========================================================================
  - core-dependencies/longhorn-app.yaml
  - core-dependencies/snapshot-controller-app.yaml
  - core-dependencies/volsync-app.yaml
  - core-dependencies/pvc-plumber-app.yaml

  # ==========================================================================
  # Waves 4-6 — broad directory discovery via ApplicationSets.
  # ==========================================================================
  - appsets/infrastructure-appset.yaml
  - appsets/database-appset.yaml
  - appsets/monitoring-appset.yaml
  - appsets/apps-appset.yaml
