# pvc-plumber — the v2 operator that watches backup-labeled PVCs and:
#   1. ensures a companion ExternalSecret/ReplicationSource/Replication-
#      Destination exists for each labeled PVC (controller-runtime),
#   2. validates new PVCs at admission time (validate-pvc / validate-pvc-
#      exempt webhooks),
#   3. injects dataSourceRef onto restorable PVCs (mutate-pvc webhook),
#   4. injects the NFS repository volume into VolSync mover Jobs
#      (mutate-job webhook).
#
# Two-wave deployment is critical:
#   - Wave 1: the Deployment, Service, RBAC, ServiceAccount, and the
#     cert-manager Issuer + Certificate (annotated sync-wave 0–1 inside
#     the manifests so they sequence even faster than the wrapper
#     Application's own annotation suggests).
#   - Wave 2: the MutatingWebhookConfiguration and
#     ValidatingWebhookConfiguration (annotated sync-wave 2 inside the
#     manifests). Webhook configs registered before the operator pod is
#     ready cause every PVC create to be rejected — full deadlock if any
#     of Longhorn/argocd/snapshot-controller need to create PVCs at boot.
#
# This Application's annotation says sync-wave: "1" because Wave 1 is
# when the path is first scanned; the wave-2 annotation on the
# webhook-config resources inside the path then sequences the
# webhook-config sync to actually wait for the operator pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pvc-plumber
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/pvc-plumber
  labels:
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: __REPLACE_ME_GIT_REPO_URL__
    targetRevision: __REPLACE_ME_GIT_BRANCH__
    path: infrastructure/controllers/pvc-plumber
  destination:
    server: https://kubernetes.default.svc
    # Operator deploys into the volsync-system namespace alongside VolSync
    # itself — keeps "all the storage backup machinery" in one place and
    # matches the source cluster's pattern.
    namespace: volsync-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      # volsync-system is created by the volsync Application; we don't want
      # to race with it on namespace ownership.
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
