---
# Hand-written ExternalSecret that templates `pvc-plumber-kopia` in
# `volsync-system` for the operator pod itself.
#
# pvc-plumber's Deployment env (`KOPIA_PASSWORD`) pulls from
# `Secret/pvc-plumber-kopia` via secretKeyRef. That Secret is produced
# by ESO templating from the `1password` ClusterSecretStore (which uses
# the kubernetes provider in this starter, pointed at
# `Secret/rustfs` in volsync-system, which the sealed-secrets controller
# unwraps from `sealed-kopia-password.yaml`).
#
# Why isn't this an operator-managed ExternalSecret like the per-PVC
# ones? Because the operator only generates ExternalSecrets in **app**
# namespaces (where backup-labeled PVCs live). It doesn't manage one
# for itself — its own credential needs to exist BEFORE the operator
# pod starts. Hand-writing this ExternalSecret keeps the credential
# in the same GitOps loop as everything else without a chicken-and-egg.
#
# Mirror of the source cluster's `pvc-plumber/externalsecret.yaml`,
# adapted: source uses ClusterSecretStore=1password (real 1Password
# backend); starter uses the same store name with a kubernetes-
# provider config (see external-secrets/cluster-secret-store.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pvc-plumber-kopia
  namespace: volsync-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: pvc-plumber-kopia
    creationPolicy: Owner
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: rustfs
        property: kopia_password
