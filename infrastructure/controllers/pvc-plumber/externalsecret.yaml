---
# Operator's own kopia/S3 credential bundle.
#
# Pre-v3.0.0 this rendered KOPIA_PASSWORD only — the operator pod read
# the Kopia repo from a filesystem (NFS) mount and didn't need S3 creds.
# v3.0.0 switched the operator to S3 (see deployment.yaml), so the same
# Secret now also carries AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
#
# The three keys here MUST line up with the per-PVC `volsync-<pvc>`
# Secret the reconciler renders for VolSync mover Jobs — same key names,
# same source-Secret/property mapping — so secret material has a single
# source of truth across operator pod and mover Jobs.
#
# Why isn't this an operator-managed ExternalSecret like the per-PVC
# ones? Because the operator only generates ExternalSecrets in **app**
# namespaces (where backup-labeled PVCs live). It doesn't manage one
# for itself — its own credential needs to exist BEFORE the operator
# pod starts. Hand-writing this ExternalSecret keeps the credential
# in the same GitOps loop without a chicken-and-egg.
#
# ─────────────────────────────────────────────────────────────────────
# Secret-store backend choice — IMPORTANT for adopters.
#
# The starter ships with **sealed-secrets** as the default backend —
# `sealed-kopia-password.yaml` in this directory is unwrapped by the
# sealed-secrets controller into `Secret/rustfs` in volsync-system, and
# the ESO ClusterSecretStore named `1password` (configured in
# `infrastructure/controllers/external-secrets/cluster-secret-store.yaml`
# with the `kubernetes` provider) reads from that Secret to template the
# `pvc-plumber-kopia` Secret you see referenced below.
#
# To swap for your secret-store of choice (1Password Connect,
# HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager,
# Azure Key Vault, Doppler, Infisical, etc.):
#
#   1. Replace the ClusterSecretStore at
#      `infrastructure/controllers/external-secrets/cluster-secret-store.yaml`
#      with the provider stanza for your backend.
#   2. Update the `secretStoreRef.name` below to point at the new
#      ClusterSecretStore (rename to a backend-neutral name like
#      `default` if you prefer — the operator binary cares only about
#      the name being consistent across pvc-plumber + the rendered
#      per-PVC ExternalSecrets).
#   3. Update the two `remoteRef` blocks to address keys/properties as
#      your chosen backend expects them. The three `secretKey` values
#      (KOPIA_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) must
#      remain stable — the operator binary hardcodes them.
#
# The pvc-plumber operator (image 3.1.0) hardcodes the
# `secretStoreRef.name` it generates in per-PVC ExternalSecrets to
# `1password`. To rename the ClusterSecretStore, you also need to set
# the operator env `OPERATOR_SECRETSTORE_NAME` (added in v3.x) — see
# the upstream README.
# ─────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pvc-plumber-kopia
  namespace: volsync-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # 1m, not 1h: bounds the worst-case wait between an ArgoCD apply and
  # ESO observing the new spec. ESO normally writes to
  # status.syncedResourceVersion within a second of a spec change via
  # the controller-runtime informer, so refreshInterval is mostly
  # irrelevant for the spec-change case. But during ESO controller
  # restarts or backoff loops, refreshInterval is the floor on how long
  # the new generation takes to be observed. Tightening it means the
  # cluster recovers faster after ESO incidents. See the v3.1 transition
  # comment in deployment.yaml for the ArgoCD↔ESO race rationale.
  refreshInterval: 1m
  # Swap for your secret-store of choice (sealed-secrets-fronted ESO,
  # 1Password Connect, Vault, AWS Secrets Manager, etc.). The default
  # `1password` name is the ClusterSecretStore the starter ships in
  # `external-secrets/cluster-secret-store.yaml` — it's an ESO/k8s
  # provider configured to read from a Secret unwrapped by sealed-
  # secrets, NOT a real 1Password backend. Rename via the
  # ClusterSecretStore + this stanza together.
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: pvc-plumber-kopia
    creationPolicy: Owner
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: rustfs
        property: kopia_password
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: rustfs
        property: k8s-admin-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: rustfs
        property: k8s-admin-secret-key
