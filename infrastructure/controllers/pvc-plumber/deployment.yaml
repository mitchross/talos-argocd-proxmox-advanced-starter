---
# pvc-plumber v2 operator — single Go binary running:
#   1. controller-runtime PVC reconciler (watches backup-labeled PVCs,
#      ensures companion Secret/ReplicationSource/ReplicationDestination
#      resources exist)
#   2. three admission webhooks on port 9443:
#        - validate-pvc.pvc-plumber.io       (failurePolicy: Fail)
#        - validate-pvc-exempt.pvc-plumber.io (failurePolicy: Ignore)
#        - mutate-pvc.pvc-plumber.io         (failurePolicy: Fail)
#        - mutate-job.pvc-plumber.io         (failurePolicy: Ignore)
#      See webhooks.yaml for the full config and the asymmetry rationale.
#   3. legacy /exists HTTP server on port 8080 (kept for backward compat
#      with the v1 oracle pattern; not consumed in the starter).
#
# Replicas=2, leader-elected. Pod anti-affinity ensures one pod per node
# so a single-node failure can't take both replicas.
#
# OPERATOR_MODE=true in production. The flag exists for emergency
# rollback to v1 HTTP-only behavior if the operator path misbehaves; flip
# back without redeploying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-plumber
  namespace: volsync-system
  labels:
    app.kubernetes.io/name: pvc-plumber
    app.kubernetes.io/component: backup-checker
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pvc-plumber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvc-plumber
    spec:
      serviceAccountName: pvc-plumber
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: pvc-plumber
            topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pvc-plumber
        # Pinned operator image. Renovate will track this in Phase 2j.
        image: ghcr.io/mitchross/pvc-plumber:2.0.0-rc1
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP
        env:
        - name: BACKEND_TYPE
          value: "kopia-fs"
        - name: KOPIA_REPOSITORY_PATH
          value: "/repository"
        - name: LOG_LEVEL
          value: "info"
        - name: CACHE_TTL
          value: "5m"
        - name: HTTP_TIMEOUT
          value: "7s"
        - name: RE_WARM_INTERVAL
          value: "90s"
        - name: KOPIA_PASSWORD
          valueFrom:
            secretKeyRef:
              # Created by the sealed-secrets controller unwrapping
              # sealed-kopia-password.yaml. See that file's header for
              # the seal-secret.sh workflow.
              name: pvc-plumber-kopia
              key: KOPIA_PASSWORD
        - name: KOPIA_CONFIG_PATH
          value: "/tmp/kopia/config/repository.config"
        - name: KOPIA_LOG_DIR
          value: "/tmp/kopia/logs"
        - name: KOPIA_CACHE_DIRECTORY
          value: "/tmp/kopia/cache"
        - name: HOME
          value: "/tmp"
        - name: USER
          value: "plumber"
        # Operator-mode configuration. The v2 binary uses these to enable
        # the controller-runtime manager + admission webhooks alongside
        # the legacy /exists HTTP server.
        - name: OPERATOR_MODE
          value: "true"
        - name: NFS_SERVER
          value: "__REPLACE_ME_NFS_SERVER__"
        - name: NFS_PATH
          value: "__REPLACE_ME_NFS_PATH__"
        # Namespaces the operator must NOT touch when reconciling/mutating.
        # Mirrors the webhook namespaceSelector exclusion list (see
        # webhooks.yaml). Keep them in sync — divergence between admission
        # and reconciler views of "what is infrastructure" is a footgun.
        #
        # Starter list (8 namespaces) — infrastructure surfaces in this
        # repo where backup-labeled PVCs would deadlock if pvc-plumber's
        # webhook fails closed:
        #   kube-system / volsync-system / argocd / longhorn-system /
        #   snapshot-controller / cert-manager / sealed-secrets /
        #   external-secrets
        # Differs from the source cluster (which has 9, including
        # `kyverno` as a defensive forward-compat marker and
        # `1passwordconnect` for the source's paid-service backend).
        # The starter drops kyverno (never been here, marker would
        # mislead readers) and 1passwordconnect (no paid services in
        # default), and adds sealed-secrets (the starter's secret
        # backend that didn't exist in source).
        - name: SYSTEM_NAMESPACES
          value: "kube-system,volsync-system,argocd,longhorn-system,snapshot-controller,cert-manager,sealed-secrets,external-secrets"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        volumeMounts:
        - name: repository
          mountPath: /repository
          readOnly: false
        - name: kopia-tmp
          mountPath: /tmp/kopia
        # controller-runtime default location for webhook serving cert.
        # Populated by cert-manager via the pvc-plumber-webhook-tls Secret
        # (see certificate.yaml).
        - name: webhook-tls
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: repository
        nfs:
          server: __REPLACE_ME_NFS_SERVER__
          path: __REPLACE_ME_NFS_PATH__
      - name: kopia-tmp
        emptyDir: {}
      - name: webhook-tls
        secret:
          secretName: pvc-plumber-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: pvc-plumber
  namespace: volsync-system
  labels:
    app.kubernetes.io/name: pvc-plumber
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pvc-plumber
  ports:
  # `name: http` and `name: webhook` are mandatory for HTTPRoute
  # compatibility, even though pvc-plumber itself doesn't expose an
  # HTTPRoute — keeping the convention so unnamed-port silently-fail bugs
  # never leak into the cluster.
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: webhook
    port: 9443
    targetPort: webhook
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pvc-plumber
  namespace: volsync-system
  labels:
    app.kubernetes.io/name: pvc-plumber
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pvc-plumber
