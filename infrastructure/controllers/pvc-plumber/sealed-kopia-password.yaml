# =============================================================================
# PLACEHOLDER — replace before bootstrap completes.
# =============================================================================
#
# This file is the GitOps source of truth for the Kopia repository
# password AND the S3 admin credentials the operator + per-PVC mover
# Jobs use. Two consumers read from it:
#
#   1. ESO's `1password` ClusterSecretStore (the kubernetes-provider
#      one configured in `infrastructure/controllers/external-secrets/
#      cluster-secret-store.yaml`) reads `Secret/rustfs` in
#      `volsync-system` for keys `kopia_password`, `k8s-admin-access-key`,
#      `k8s-admin-secret-key`. Per-app-namespace ExternalSecrets created
#      by the pvc-plumber operator hit this ClusterSecretStore to
#      template per-PVC mover-Job credentials.
#
#   2. The hand-written `externalsecret.yaml` in this directory templates
#      a `pvc-plumber-kopia` Secret in `volsync-system` from the same
#      three keys — the pvc-plumber Deployment's pod reads them from
#      disk via the v3.1 lazy-credentials volume mount at
#      /var/secret/pvc-plumber-kopia (see deployment.yaml).
#
# **The Secret name `rustfs` and the three property keys are NOT
# arbitrary.** The pvc-plumber operator (image 3.1.0) hardcodes them in
# the ExternalSecrets it generates:
#
#   secretStoreRef.name = "1password"          → ClusterSecretStore name
#   remoteRef.key       = "rustfs"             → source-Secret name
#   remoteRef.property  = "kopia_password"     → Kopia repo password
#                       = "k8s-admin-access-key"  → S3 access key id
#                       = "k8s-admin-secret-key"  → S3 secret access key
#
# Don't rename. The operator binary doesn't expose these as env vars.
#
# -----------------------------------------------------------------------------
# Workflow
# -----------------------------------------------------------------------------
# In the starter, this file is created by the sealed-secrets controller
# unwrapping a real SealedSecret committed here. To create one:
#
#   1. Make sure the cluster is up and the sealed-secrets controller is
#      Running (`kubectl get pods -n sealed-secrets`).
#   2. Run, from the repo root:
#         ./scripts/seal-secret.sh
#      This generates a 32-byte random password, kubeseal-s it against
#      the cluster's public key, and overwrites THIS FILE with a
#      SealedSecret YAML. Commit + push.
#   3. ArgoCD picks up the new file, the sealed-secrets controller
#      unwraps it into `Secret/rustfs` in volsync-system, ESO's
#      `1password` ClusterSecretStore reads it, and the pvc-plumber
#      Deployment + the operator-created per-PVC ExternalSecrets all
#      resolve in the same direction.
#
# Until you run seal-secret.sh, the manifest below is a STUB regular
# Secret with a placeholder value. The pvc-plumber Deployment will
# CrashLoopBackOff (mounted password is bogus) and per-PVC backups will
# fail. **DO NOT use this in production**: the SealedSecret seal step
# is mandatory.
#
# To swap to External Secrets Operator + 1Password / Vault / AWS Secrets
# Manager, see docs/extending/swapping-secret-backend.md (only the
# `cluster-secret-store.yaml` provider stanza changes — ESO is already
# in the starter, so the swap is small).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rustfs
  namespace: volsync-system
  labels:
    app.kubernetes.io/name: pvc-plumber
    # `historic-name: rustfs` flag for future readers — the name comes
    # from the source cluster's RustFS-S3-as-1Password-vault-item naming
    # convention. Renaming it requires an operator-binary change.
    pvc-plumber.starter/historic-name: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  # PLACEHOLDER. Run scripts/seal-secret.sh to replace this whole file
  # with a real SealedSecret. Until then, backups will not function.
  #
  # Three keys must be set:
  #   - kopia_password        Kopia repository password (32-byte random)
  #   - k8s-admin-access-key  S3 access key id (your S3 backend)
  #   - k8s-admin-secret-key  S3 secret access key (your S3 backend)
  kopia_password: "REPLACE_ME_VIA_SEAL_SECRET_SH"
  k8s-admin-access-key: "REPLACE_ME_VIA_SEAL_SECRET_SH"
  k8s-admin-secret-key: "REPLACE_ME_VIA_SEAL_SECRET_SH"
