# =============================================================================
# PLACEHOLDER — replace before bootstrap completes.
# =============================================================================
#
# The pvc-plumber operator needs a Kopia repository password to read
# (and write) backups in the NFS-mounted Kopia repo. The Kopia password
# never leaves the cluster: it's stored as a regular Kubernetes Secret
# named `pvc-plumber-kopia` in the `volsync-system` namespace, and the
# Deployment's `KOPIA_PASSWORD` env var pulls from `secretKeyRef`.
#
# In the starter, that Secret is produced by the sealed-secrets controller
# unwrapping a SealedSecret committed to this file. To create one:
#
#   1. Make sure the cluster is up and the sealed-secrets controller is
#      Running (`kubectl get pods -n sealed-secrets`).
#   2. Run, from the repo root:
#         ./scripts/seal-secret.sh
#      This generates a 32-byte random password, kubeseal-s it against
#      the cluster's public key, and overwrites THIS FILE with a real
#      SealedSecret YAML. Commit + push.
#   3. ArgoCD will pick up the new file on its next reconcile, the
#      sealed-secrets controller will unwrap it into a regular Secret,
#      and the pvc-plumber Deployment will leave CrashLoopBackOff.
#
# Until you run seal-secret.sh, the manifest below is a STUB regular
# Secret with a placeholder password value. ArgoCD will apply it (the
# Deployment will technically start and crash on first /exists call
# because the password won't match a real Kopia repo), but **DO NOT use
# this in production**: a real password must be sealed and committed.
#
# To swap to External Secrets Operator + 1Password / Vault / AWS Secrets
# Manager, see docs/extending/swapping-secret-backend.md (Phase-1 stub).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pvc-plumber-kopia
  namespace: volsync-system
  labels:
    app.kubernetes.io/name: pvc-plumber
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  # PLACEHOLDER. Run scripts/seal-secret.sh to replace this whole file
  # with a real SealedSecret. Until then, backups will not function.
  KOPIA_PASSWORD: "REPLACE_ME_VIA_SEAL_SECRET_SH"
