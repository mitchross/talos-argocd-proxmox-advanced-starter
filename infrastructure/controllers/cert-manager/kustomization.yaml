apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - ns.yaml
  - cluster-issuer.yaml

# Pin to v1.20.2 — matches source. Renovate bumps this through 2j's
# renovate.json. cert-manager is critical infrastructure: never float.
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.20.2
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
    includeCRDs: true
