# cert-manager Helm values — starter cluster.
#
# Trimmed from source's homelab values:
# - Source has DNS-01 args for Cloudflare ACME (`--dns01-recursive-
#   nameservers-only`, `--dns01-check-retry-period`, etc.). The starter's
#   default ClusterIssuer is selfSigned, no DNS-01 needed. Documented in
#   docs/extending/adding-cloudflare.md.
# - Source's Prometheus ServiceMonitor block is commented out — left
#   commented here too. Re-enable when monitoring helper has the
#   matching `release: kube-prometheus-stack` selector wired (it does).
#
# Kept verbatim:
# - global.leaderElection.namespace pinned to cert-manager (without this,
#   the controller hits RBAC permission errors during leader election)
# - crds.enabled + keep — Argo manages the chart lifecycle, but if the
#   chart is ever uninstalled we want the CRDs and any in-flight
#   Certificates/Issuers to survive
# - config.enableGatewayAPI — required for cert-manager's gateway-shim,
#   which watches Gateways with the cert-manager.io/cluster-issuer
#   annotation and creates Certificates for them
# - --enable-certificate-owner-ref — when a Certificate is deleted,
#   the resulting Secret gets garbage-collected too (without this, you
#   accumulate orphaned cert Secrets on every Certificate churn)
# - securityContext + RuntimeDefault seccomp — modest hardening defaults
# - chart-default resource sizes (NOT source's CPU 200m/memory 256Mi
#   bumps — fine for a starter cluster scale)

global:
  leaderElection:
    namespace: cert-manager

crds:
  enabled: true
  keep: true

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

extraArgs:
  - "--enable-certificate-owner-ref=true"

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

webhook:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

cainjector:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

# ServiceMonitor disabled until the monitoring helper ships
# kube-prometheus-stack. Re-enable then; release label must match.
# prometheus:
#   enabled: true
#   servicemonitor:
#     enabled: true
#     prometheusInstance: default
#     targetPort: 9402
#     path: /metrics
#     interval: 60s
#     scrapeTimeout: 30s
#     labels:
#       release: kube-prometheus-stack
