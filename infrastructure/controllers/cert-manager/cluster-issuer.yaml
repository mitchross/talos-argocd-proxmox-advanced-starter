---
# Self-signed ClusterIssuer — the starter's default for issuing TLS certs
# to the internal Gateway and any in-cluster Certificate.
#
# What this gives you:
# - cert-manager will issue a self-signed cert for the Gateway listener
#   (via the `cert-manager.io/cluster-issuer: selfsigned-cluster-issuer`
#   annotation on `infrastructure/networking/gateway/gw-internal.yaml`)
# - First browser visit to argocd.<your-domain> / longhorn.<your-domain>
#   shows the standard "self-signed cert" warning. Click through, accept,
#   subsequent visits are silent. Or import the issuer's CA cert into
#   your browser/OS keystore for clean trust.
#
# What you give up vs. real CA-issued certs:
# - Untrusted by default in browsers / OSes / corporate auth systems
# - No domain validation against any external authority
# - Can't be used for any externally-reachable surface (CT logs etc.
#   require ACME)
#
# Why this is the right starter default:
# - Zero external dependencies (no ACME provider, no DNS API token,
#   no Cloudflare account, no public IP)
# - The "advanced" cluster works on a fresh laptop with localhost-only
#   DNS — nothing leaves the homelab
# - Swap to Let's Encrypt + DNS-01 (Cloudflare or any other supported
#   DNS provider) is a 30-line cert-manager change, recipe in
#   docs/extending/adding-cloudflare.md
#
# Source cluster's cluster-issuer.yaml ships a `cloudflare-cluster-
# issuer` (Let's Encrypt + DNS-01 via Cloudflare). That's the recipe
# this file replaces in the default starter.
#
# sync-wave: "5" so this is created AFTER cert-manager's chart resources
# at wave 4 — the ClusterIssuer needs the CRDs + controller running
# before it can be admitted. ArgoCD's per-resource sync-waves sequence
# inside an Application even when the Application itself is at a fixed
# wave from the AppSet template.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: Validate=true
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  selfSigned: {}
