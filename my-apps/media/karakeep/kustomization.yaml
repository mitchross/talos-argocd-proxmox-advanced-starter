apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: karakeep
resources:
- namespace.yaml
# Chrome resources
- chrome/deployment-chrome.yaml
- chrome/service-chrome.yaml
# karakeep resources
- karakeep/deployment-web.yaml
- karakeep/service-web.yaml
- karakeep/externalsecret.yaml
- karakeep/httproute.yaml
- karakeep/pvc-data.yaml
# Meilisearch resources
- meilisearch/deployment-meilisearch.yaml
- meilisearch/service-meilisearch.yaml
- meilisearch/pvc-meilisearch.yaml
# kopiur backup — data-pvc only. meilisearch-pvc is DELIBERATELY exempt
# (derived index; see its backup-exempt label + reason annotation). The stub
# carries the varying bits incl. the mover uid (karakeep data owner = 1001);
# uniform fields (repository, copyMethod, snapclass, populator,
# onMissingSnapshot) are injected by the shared component below.
- kopiur/data-pvc.yaml

components:
  - ../../common/kopiur-backup

configMapGenerator:
  - name: karakeep-configuration
    envs:
      - karakeep/karakeep-configuration.env
