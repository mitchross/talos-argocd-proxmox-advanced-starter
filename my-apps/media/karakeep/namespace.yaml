apiVersion: v1
kind: Namespace
metadata:
  name: karakeep
  labels:
    # The ONE label that opts a namespace into backups: drives the
    # ClusterExternalSecret credential fan-out AND ClusterRepository tenancy
    # (allowedNamespaces selector).
    kopiur.home-operations.com/repo: cluster-kopia
  # No privileged-movers annotation: karakeep's mover runs as the data owner
  # (uid 1001, set in kopiur/data-pvc.yaml). The annotation is only required
  # when a mover must run as root (uid 0).
