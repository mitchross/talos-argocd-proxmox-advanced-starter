apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: karakeep
  annotations:
    # dataSourceRef is immutable on a Bound PVC — these two mask the
    # resulting ArgoCD diff (SSA dry-run rejects the immutable field); the
    # AppSet ignoreDifferences covers the live compare.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    app: karakeep
    type: data-storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
  # Restore-before-bind: on (re)creation Kubernetes withholds binding while
  # kopiur's Restore/data-pvc-restore populates the volume from the latest
  # snapshot — the PVC binds WITH data or (backend down) not at all.
  # No-op while already Bound.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: data-pvc-restore
