apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-pvc
  namespace: karakeep
  labels:
    app: karakeep
    type: meilisearch-storage
    # DELIBERATELY not backed up: the search index is derived data — karakeep
    # reindexes it from data-pvc. Exempt PVCs ship NO kopiur bundle and NO
    # dataSourceRef; they recreate EMPTY after DR, by recorded decision.
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "derived Meilisearch index; karakeep rebuilds it from data-pvc on start (2026-07-02)"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
