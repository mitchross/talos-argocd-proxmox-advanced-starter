apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki-stack

# Per repo CLAUDE.md: every YAML in this directory MUST be listed here
# under `resources:` — Kustomize does NOT auto-discover files. The
# starter's loki-stack is intentionally minimal — no per-tenant
# configs, no S3 ExternalSecret. Promtail / Alloy log shippers can be
# layered on as a follow-up; the chart already ships an HTTP push
# endpoint via `loki-gateway` that any client can target.
resources:
  - ns.yaml

# Helm chart fetch + render. Per the architect's 2b ArgoCD values.yaml,
# argocd-cm has `kustomize.buildOptions: --enable-helm` so this is
# honored at sync time.
#
# Pin: 13.2.5 — matches source homelab. The chart was migrated from
# grafana/helm-charts to grafana-community/helm-charts on 2026-04-27
# upstream; this repo is the canonical OSS Loki chart since the
# original split GEL-only at v7.0.0.
helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 13.2.5
    releaseName: loki
    namespace: loki-stack
    valuesFile: values.yaml
    includeCRDs: true
