# PatchTransformer: inject the backup-exempt LABEL onto Loki's PVC.
#
# Why this lives in a kustomize patch and not in values.yaml: the
# loki Helm chart 13.2.5 exposes `singleBinary.persistence.annotations`
# but NOT `singleBinary.persistence.labels` — there's no values key
# that injects labels into the StatefulSet's `volumeClaimTemplates[0]
# .metadata.labels` field. The label is the half of the contract that
# matters: pvc-plumber's webhook reads `metadata.labels.backup-exempt`,
# not the annotation, when deciding whether to require an explicit
# backup intent declaration on a Longhorn-backed PVC.
#
# This patch is also a deliberate teaching artifact: the starter's
# own observability stack uses the v2.1 backup-exempt contract that
# `apps/stateful-demo/` (and any user-supplied app) is expected to
# follow. Loki's PVC is intentionally NOT backed up — log data is
# ephemeral, retention is configured in Loki itself (7-day filesystem
# retention via `limits_config.retention_period: 168h`). The
# `backup-exempt: "true"` label tells pvc-plumber's webhooks (when
# configured to validate exempt-PVCs) that this is intentional, and
# prevents the `LonghornPVCMissingBackupLabel` PrometheusRule (in
# monitoring/kube-prometheus-stack/longhorn-pvc-backup-audit.yaml)
# from firing on it after 30 minutes of unlabeled existence.
#
# Note on the JSON Patch `op: add` semantics: the annotations map IS
# replaced wholesale by this patch. The chart-level annotation we
# previously set via values.yaml's `singleBinary.persistence.annotations`
# was removed in this same commit so the patch is the single source
# of truth for what ends up on the rendered PVC. Don't re-add the
# values.yaml annotation without converting this to per-key add ops
# (`/spec/volumeClaimTemplates/0/metadata/annotations/<key>`).
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: loki-pvc-backup-exempt
patch: |-
  - op: add
    path: /spec/volumeClaimTemplates/0/metadata/labels
    value:
      backup-exempt: "true"
  - op: add
    path: /spec/volumeClaimTemplates/0/metadata/annotations
    value:
      storage.vanillax.dev/backup-exempt-reason: "scratch"
target:
  kind: StatefulSet
  name: loki
