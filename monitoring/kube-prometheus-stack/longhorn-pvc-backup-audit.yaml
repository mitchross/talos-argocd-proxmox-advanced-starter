---
# Audit alert for Longhorn PVCs without explicit backup intent.
#
# This is the platform's backstop for PVCs that slip through the
# admission webhook's mutate path — i.e. PVCs that declare neither
# `backup: hourly|daily` nor `backup-exempt: "true"`. The pvc-plumber
# webhook denies / mutates *labeled* PVCs; this alert catches the
# *unlabeled* ones, where intent was never recorded.
#
# Two design notes:
#   * Severity is "warning" (alert), not denial — nothing is blocked.
#     The webhook handles deny semantics; this is a backstop only.
#   * The match runs against kube-state-metrics rather than the live
#     API, so it depends on `metricLabelsAllowlist` exposing `backup`,
#     `backup-exempt`, and `cnpg.io/cluster` (configured in values.yaml).
#
# CNPG database PVCs are excluded via the `cnpg.io/cluster` label
# rather than only by namespace, because CNPG `Cluster` CRs can live
# in app namespaces (e.g. `apps/postgres-demo/`). Their backup path is
# Barman → S3, not VolSync/Kopia.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-pvc-backup-audit
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    # Required for the chart's Prometheus instance to pick the rule up.
    # Pairs with `release: kube-prometheus-stack` on ServiceMonitors —
    # the operator's default selector is `release=<release-name>`.
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: longhorn-pvc-backup-audit
      rules:
        - alert: LonghornPVCMissingBackupLabel
          # Surfaces Longhorn PVCs whose backup intent is implicit. To
          # clear this alert, set one of:
          #   metadata.labels.backup: "hourly"     (hourly Kopia backup)
          #   metadata.labels.backup: "daily"      (daily Kopia backup)
          #   metadata.labels.backup-exempt: "true" (acknowledged: not backed up)
          #
          # The starter's 8 system / infra namespaces are excluded inline.
          # This list is the same one the pvc-plumber operator carries in
          # SYSTEM_NAMESPACES (see infrastructure/controllers/pvc-plumber/
          # deployment.yaml). Keeping them in sync matters: if the
          # webhook's "what is infrastructure" view drifts from the
          # alert's, you get either silent gaps in the audit or false
          # positives on bootstrapping infra.
          #
          # `volsync-*` PVC names are excluded because VolSync's mover
          # cache PVCs live alongside the source and are never operator-
          # authored. CNPG-managed PVCs are excluded via label, not
          # namespace.
          expr: |
            kube_persistentvolumeclaim_info{
              storageclass="longhorn",
              namespace!~"kube-system|volsync-system|argocd|longhorn-system|snapshot-controller|cert-manager|sealed-secrets|external-secrets",
              persistentvolumeclaim!~"volsync-.*"
            }
            unless on (namespace, persistentvolumeclaim) (
              kube_persistentvolumeclaim_labels{label_backup=~"hourly|daily"}
              or
              kube_persistentvolumeclaim_labels{label_backup_exempt="true"}
              or
              kube_persistentvolumeclaim_labels{label_cnpg_io_cluster!=""}
            )
          for: 30m
          labels:
            severity: warning
            component: longhorn
            category: backup
          annotations:
            summary: "Longhorn PVC missing explicit backup intent: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
            description: |
              Longhorn PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}
              declares neither `backup` (hourly|daily) nor
              `backup-exempt: "true"`. Set one explicitly so backup intent
              is recorded in Git.

              Actions:
                1. Critical data: add label `backup: hourly` or `backup: daily`.
                   The pvc-plumber operator will provision an
                   ExternalSecret + ReplicationSource + ReplicationDestination
                   on the next reconcile.
                2. Ephemeral / reproducible / cache: add
                   `backup-exempt: "true"` to acknowledge it is not backed up.
                3. Wrong storage class for this PVC? Move it off Longhorn —
                   Longhorn is reserved for snapshot-capable, backup-eligible
                   workloads.
