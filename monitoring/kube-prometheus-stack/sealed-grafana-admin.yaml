# =============================================================================
# PLACEHOLDER — replace before exposing Grafana.
# =============================================================================
#
# Grafana's admin credentials live behind the existingSecret reference
# in values.yaml:
#
#   grafana:
#     admin:
#       existingSecret: grafana-admin-credentials
#       userKey: admin-user
#       passwordKey: admin-password
#
# This file is the GitOps source of truth for that Secret. Same pattern
# as `infrastructure/controllers/pvc-plumber/sealed-kopia-password.yaml`:
# the file ships as a stub regular Secret with placeholder values, and
# the user replaces it with a real SealedSecret on first cluster boot.
#
# -----------------------------------------------------------------------------
# Workflow
# -----------------------------------------------------------------------------
# 1. Cluster up, sealed-secrets controller Running:
#       kubectl get pods -n sealed-secrets
# 2. Generate a random admin password and seal it. From the repo root:
#       PASSWORD="$(openssl rand -base64 24)"
#       kubectl create secret generic grafana-admin-credentials \
#         --namespace=kube-prometheus-stack \
#         --from-literal=admin-user=admin \
#         --from-literal=admin-password="$PASSWORD" \
#         --dry-run=client -o yaml \
#       | kubeseal --format=yaml \
#       > monitoring/kube-prometheus-stack/sealed-grafana-admin.yaml
# 3. Save the password somewhere safe (1Password, password manager).
#    The sealed file in git is unreadable by anyone but the cluster.
# 4. Commit + push. ArgoCD picks up the SealedSecret, the controller
#    unwraps it into Secret/grafana-admin-credentials, the Grafana pod
#    rolls and you can log in with admin / your-password.
#
# Until step 2 runs, the placeholder below makes Grafana log-in fail
# (the password is the literal string "REPLACE_ME_VIA_SEAL_SECRET_SH").
# That's intentional — silent fallback to "admin/prom-operator" would
# leave a publicly-known password on a UI exposed via the internal
# Gateway.
#
# `scripts/seal-secret.sh` (added in Phase 2j) is a thin wrapper around
# the above kubeseal command. The interactive flow there will prompt for
# the secret name and write the file in place.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  admin-user: admin
  # PLACEHOLDER. Replace this entire file with a SealedSecret produced
  # by the steps above. Do NOT use this in production.
  admin-password: "REPLACE_ME_VIA_SEAL_SECRET_SH"
