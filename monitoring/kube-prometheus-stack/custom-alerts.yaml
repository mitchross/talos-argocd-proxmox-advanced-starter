# Generic cluster + ArgoCD + monitoring-stack alerts.
#
# Adapted from the source homelab cluster's monitoring/prometheus-stack/
# custom-alerts.yaml. The starter keeps the platform-feature alerts
# (cluster health, Longhorn storage, ArgoCD app sync, monitoring-stack
# self-health, pod readiness) and drops nothing here — these all apply
# regardless of which apps the user runs on top.
#
# Note on `condition` label casing: kube-state-metrics emits the
# `condition` label LOWERCASE on `kube_pod_status_ready`
# ("true"/"false"/"unknown"). On `kube_node_status_condition` the
# `condition` label is the condition type ("Ready", "MemoryPressure",
# ...) and `status` is lowercase. Both forms below are correct;
# the source cluster has a regression-test history here (see the
# inline comment in the network.connectivity group).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-cluster-alerts
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: kubernetes.cluster.health
      interval: 30s
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been not ready for more than 5 minutes."
        - alert: KubernetesPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is restarting {{ printf \"%.2f\" $value }} times every 15 minutes."
        - alert: KubernetesPodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 10 minutes."

    - name: kubernetes.resources
      interval: 30s
      rules:
        - alert: NodeMemoryHighUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} has high memory usage"
            description: "Node {{ $labels.instance }} memory usage is above 85% (current value: {{ printf \"%.2f\" $value }}%)"
        - alert: NodeDiskSpaceUsage
          expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} disk usage is high"
            description: "Node {{ $labels.instance }} disk usage on {{ $labels.mountpoint }} is above 85% (current value: {{ printf \"%.2f\" $value }}%)"
        - alert: NodeCPUHighUsage
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} has high CPU usage"
            description: "Node {{ $labels.instance }} CPU usage is above 90% (current value: {{ printf \"%.2f\" $value }}%)"

    - name: argocd.health
      interval: 30s
      rules:
        - alert: ArgoCDApplicationNotSynced
          expr: argocd_app_info{sync_status!="Synced"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD Application {{ $labels.name }} is not synced"
            description: "ArgoCD Application {{ $labels.name }} in project {{ $labels.project }} has been out of sync for more than 15 minutes."
        - alert: ArgoCDApplicationUnhealthy
          expr: argocd_app_info{health_status!="Healthy",health_status!="Progressing"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD Application {{ $labels.name }} is unhealthy"
            description: "ArgoCD Application {{ $labels.name }} in project {{ $labels.project }} is in an unhealthy state."

    - name: storage.longhorn
      interval: 30s
      rules:
        - alert: LonghornVolumeHealthy
          expr: longhorn_volume_state{state!~"attached|detached"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is unhealthy"
            description: "Longhorn volume {{ $labels.volume }} is in state {{ $labels.state }}"
        - alert: LonghornNodeStorageSpaceLow
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node {{ $labels.node }} storage space is low"
            description: "Longhorn node {{ $labels.node }} storage usage is above 90% (current value: {{ printf \"%.2f\" $value }}%)"

    - name: monitoring.stack.health
      interval: 30s
      rules:
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus target {{ $labels.instance }} is down"
            description: "Prometheus target {{ $labels.instance }} for job {{ $labels.job }} has been down for more than 10 minutes."
        - alert: PrometheusConfigurationReloadFailure
          expr: prometheus_config_last_reload_successful != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus configuration reload failure"
            description: "Prometheus {{ $labels.instance }} configuration reload has failed."
        - alert: AlertmanagerConfigurationReloadFailure
          expr: alertmanager_config_last_reload_successful != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager configuration reload failure"
            description: "Alertmanager {{ $labels.instance }} configuration reload has failed."

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-application-alerts
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: applications.health
      interval: 60s
      rules:
        - alert: ApplicationHighMemoryUsage
          expr: (container_memory_working_set_bytes{container!="POD",container!=""} / container_spec_memory_limit_bytes) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has high memory usage"
            description: "Container {{ $labels.container }} memory usage is above 90% of its limit (current value: {{ printf \"%.2f\" $value }}%)"

    - name: network.connectivity
      interval: 30s
      rules:
        # IMPORTANT: kube-state-metrics emits the `condition` label in
        # LOWERCASE ("true" / "false" / "unknown") on kube_pod_status_ready.
        # An earlier version of this rule used `condition="True"` which
        # never matched anything, so the `unless` filter excluded nothing
        # and the alert fired for every Running pod cluster-wide.
        # Verified series shape:
        #   kube_pod_status_ready{condition="true"|"false"|"unknown"}
        # The `phase="Running"` series is also value 0/1 per phase, so we
        # filter to == 1 to avoid matching pods that are NOT in Running
        # phase (which would still emit a value-0 row).
        - alert: PodNetworkUnavailable
          expr: |
            (kube_pod_status_phase{phase="Running"} == 1)
            unless on (namespace, pod)
            (kube_pod_status_ready{condition="true"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} network may be unavailable"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is running but not ready, which may indicate network issues."
