# Alertmanager configuration via strategic-merge patch.
#
# The kube-prometheus-stack chart creates a Secret named
# `alertmanager-kube-prometheus-stack-alertmanager` containing the
# rendered alertmanager.yml. Patching it in-place via kustomize lets
# us own the routing/inhibition/receivers tree without forking the
# chart's values.yaml structure (which uses a different schema for
# alertmanagerConfiguration).
#
# All notification methods below are STUBBED webhooks pointing at
# 127.0.0.1:5001 — that's a "no-op" target so a fresh starter cluster
# doesn't try to deliver alerts to anywhere real until the user has
# wired up Slack / Discord / email / PagerDuty / etc. To plug in a real
# notifier:
#   1. Edit the receivers below (see commented examples for slack/email).
#   2. Re-deploy via your normal GitOps push.
#
# Or, swap to the `AlertmanagerConfig` CRD pattern (a separate CR per
# tenant/team) if you want per-namespace routing — see
# https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1alpha1.AlertmanagerConfig.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: kube-prometheus-stack
type: Opaque
stringData:
  alertmanager.yml: |
    # Stub configuration. Replace receivers below before relying on
    # alerting in production.
    global:
      # Tweak smtp_smarthost / smtp_from if you wire up email_configs.
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@example.com'

    templates:
      - '/etc/alertmanager/config/*.tmpl'

    route:
      group_by: ['cluster', 'alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'web.hook'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 5s
          group_interval: 2m
          repeat_interval: 5m
        - match:
            severity: warning
          receiver: 'warning-alerts'
          group_interval: 10m
          repeat_interval: 2h
        - match_re:
            alertname: '^(NodeDown|KubeletDown|PrometheusDown)$'
          receiver: 'infrastructure-alerts'
          group_wait: 5s
          repeat_interval: 10m

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['cluster', 'service']
      - source_match:
          alertname: 'NodeDown'
        target_match_re:
          alertname: '^(NodeDiskRunningFull|NodeFilesystemSpaceFillingUp|NodeMemoryHighUtilization)$'
        equal: ['instance']

    receivers:
      - name: 'web.hook'
        webhook_configs:
          - url: 'http://127.0.0.1:5001/'
            send_resolved: true
      # Wire your critical receiver here. Examples:
      #   email_configs:
      #     - to: 'oncall@your-domain'
      #       subject: 'CRITICAL: {{ .GroupLabels.alertname }}'
      #   slack_configs:
      #     - api_url: '<your-slack-webhook>'
      #       channel: '#alerts'
      - name: 'critical-alerts'
        webhook_configs:
          - url: 'http://127.0.0.1:5001/'
            send_resolved: true
      - name: 'warning-alerts'
        webhook_configs:
          - url: 'http://127.0.0.1:5001/'
            send_resolved: true
      - name: 'infrastructure-alerts'
        webhook_configs:
          - url: 'http://127.0.0.1:5001/'
            send_resolved: true
