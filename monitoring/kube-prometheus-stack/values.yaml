# kube-prometheus-stack values for the starter cluster.
#
# Opinionated minimalism: resource sizing left at chart defaults (the
# source homelab has VPA-tuned overrides; in a fresh starter it's better
# to let chart authors' defaults stand and tune only after `kubectl top`
# tells you what you actually use). Same rationale as the ArgoCD values
# in 2b — defaults beat guesses.
#
# Persistence sizes are intentionally smaller than source: a starter
# doesn't need 50Gi of metrics history before the user has decided whether
# they want monitoring at all. Bump after first drift.
#
# What's been stripped relative to source:
#   - GPU/DCGM exporters and dashboards (no GPU in starter)
#   - PostHog/Immich/Frigate/Tapo/Solar/radar-ng dashboards (homelab apps)
#   - epever-solar / kube-etcd / kube-controller-manager / kube-scheduler
#     additionalScrapeConfigs (homelab IPs and Talos-specific machineconfig
#     bind-address patches — those belong as a recipe, not a default)
#   - VPA-tuned resources blocks (chart defaults instead)
#   - inline grafana adminPassword (replaced with sealed-secret reference)
#   - root_url pointing at vanillax.me (omitted; chart default is fine)
#   - Tempo datasource (no Tempo in starter)
#   - extra dashboard providers / folders (chart defaults are sufficient)

global:
  imageRegistry: ""
  imagePullSecrets: []

# Install CRDs alongside the chart so the Prometheus Operator has its CRDs
# at first sync. Same as source.
crds:
  enabled: true

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  enabled: true
  prometheusSpec:
    # 7-day retention, 25Gi cap. Starter scope. Bump retention to 15d /
    # retentionSize: 25GB once you want longer history.
    retention: 7d
    retentionSize: 25GB
    walCompression: true
    storageSpec:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt. Prometheus metrics are
          # re-scrapeable within retention; restoring N days of historical
          # metrics from a Kopia snapshot is not worth the I/O cost. Same
          # design call as the source homelab (the magic `backup: hourly`
          # label flow would otherwise pull this 30Gi PVC into the
          # backup pipeline every hour for no recovery value).
          labels:
            backup-exempt: "true"
          annotations:
            backup-exempt-reason: "Prometheus metrics are re-scrapeable; not worth backup pipeline overhead"
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
    # Don't constrain ServiceMonitor / PodMonitor / PrometheusRule
    # discovery to chart-installed-only. Anything in the cluster carrying
    # the conventional `release: kube-prometheus-stack` label gets picked
    # up. Without these flags, the operator filters by Helm-release label
    # which is fragile across re-installs.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    evaluationInterval: 30s
    scrapeTimeout: 10s
    # No homelab-specific additionalScrapeConfigs in the starter. The
    # source cluster scrapes the Talos control-plane bind addresses
    # (etcd / kube-controller-manager / kube-scheduler) via a
    # kubernetes_sd_configs role:node + relabel pattern, but that
    # requires a matching machineconfig patch enabling those bind
    # addresses (etcd.listen-metrics-urls, controllerManager.bind-address,
    # scheduler.bind-address). Both halves belong together as an
    # extension recipe, not a default.
    additionalScrapeConfigs: []
    remoteWrite: []
    alerting:
      alertmanagers:
        - namespace: kube-prometheus-stack
          name: kube-prometheus-stack-alertmanager
          port: 9093

# ---------------------------------------------------------------------------
# AlertManager
# ---------------------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    strategy:
      type: Recreate
    storage:
      volumeClaimTemplate:
        metadata:
          # Backup-exempt for the same reason as Prometheus's PVC: silences
          # are operator-set and trivially recreated; the notification log
          # tracks a 5-minute window of "have we already fired this?"
          # state, not historical record.
          labels:
            backup-exempt: "true"
          annotations:
            backup-exempt-reason: "Alertmanager silences are operator-set; trivially recreated"
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 512Mi
    retention: 72h
    # configSecret remains unset — the strategic-merge patch in
    # alertmanager-config.yaml supplies the actual receivers / routes.

# ---------------------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------------------
grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
  # Admin credentials come from a sealed-secret rather than the
  # chart-default "prom-operator". The sealed source-of-truth lives at
  # monitoring/kube-prometheus-stack/sealed-grafana-admin.yaml — until the
  # user runs scripts/seal-secret.sh, that file ships a placeholder Secret
  # which Grafana refuses to log into. See the file header for the seal
  # workflow.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    # Backup-exempt: dashboards and datasources are GitOps-managed (this
    # values.yaml + the dashboard ConfigMaps) — the PVC only holds user
    # prefs and unsaved drafts. Not worth the backup pipeline overhead.
    labels:
      backup-exempt: "true"
    annotations:
      backup-exempt-reason: "Dashboards/datasources are GitOps-managed; only user prefs in PVC"

  # Sidecar discovers ConfigMaps labeled grafana_dashboard=1 in any
  # namespace and mounts them as JSON files. This is how the
  # custom-servicemonitors.yaml pattern works for dashboards too — drop a
  # ConfigMap with the label, Grafana picks it up live. The starter's
  # bundled dashboards are the chart defaults plus a small curated set
  # below.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: UTC

  # Inline dashboards loaded from grafana.com by gnetId. Curated to
  # cover what this starter actually ships:
  #   * node-exporter-full       — host metrics for the chart's nodeExporter
  #   * argocd                   — ArgoCD operational dashboard
  #   * longhorn                 — Longhorn storage dashboard
  #   * cloudnative-pg           — CNPG cluster dashboard (postgres-demo)
  # Anything app-specific (PostHog, Immich, Frigate, etc.) belongs in the
  # demo app's own directory as a sidecar ConfigMap, not here.
  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 36
        datasource: Prometheus
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: Prometheus
      cloudnative-pg:
        gnetId: 20417
        revision: 3
        datasource: Prometheus

  # Loki datasource auto-provisioned. Tempo intentionally omitted — the
  # starter doesn't ship Tempo (no OTEL operator either; that's a recipe).
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.loki-stack.svc.cluster.local
      jsonData:
        timeout: 60
        maxLines: 1000

  grafana.ini:
    # No `server.root_url` here — the chart auto-detects from the Grafana
    # service URL. If you want Grafana's "Share" links to render with your
    # public hostname, set:
    #   grafana.ini.server.root_url: https://grafana.<your-domain>
    # in a values override.
    security:
      allow_embedding: true
      cookie_secure: true
      strict_transport_security: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
    snapshots:
      external_enabled: false
    explore:
      enabled: true

# ---------------------------------------------------------------------------
# Node exporter
# ---------------------------------------------------------------------------
nodeExporter:
  enabled: true
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer

# ---------------------------------------------------------------------------
# kube-state-metrics
# ---------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

# kube-state-metrics sub-chart values. Expose PVC backup labels and
# annotations so that:
#   * the longhorn-pvc-backup-audit alert can join on the real `backup`
#     label rather than on a missing volumeattributesclass series, and
#   * the ProtectedPVCSkipRestoreStale alert (in volsync-alerts.yaml) can
#     detect long-lived skip-restore escape-hatch annotations the operator
#     forgot to remove after a rebuild.
# `cnpg.io/cluster` exposure lets the longhorn-pvc-backup-audit alert
# exclude CNPG-managed PVCs by label rather than only by namespace
# (Cluster CRs can live in app namespaces). kube-state-metrics sanitizes
# the label name to `label_cnpg_io_cluster`.
kube-state-metrics:
  metricLabelsAllowlist:
    - persistentvolumeclaims=[backup,backup-exempt,cnpg.io/cluster]
  metricAnnotationsAllowList:
    - persistentvolumeclaims=[volsync.backup/skip-restore,volsync.backup/skip-restore-reason]

# ---------------------------------------------------------------------------
# Prometheus Operator
# ---------------------------------------------------------------------------
prometheusOperator:
  enabled: true
  # Use cert-manager for the admission webhook cert instead of the chart's
  # default Helm-hook Jobs. The hook Jobs create a ServiceAccount as a hook
  # resource, then Jobs that depend on it. ArgoCD can delete the SA before
  # the patch Job runs, causing a permanent stuck sync that cascades into
  # API-server load. cert-manager is at Wave 4 in the starter, same wave
  # as this chart's installation, so the cert is available by the time
  # the operator rolls out.
  admissionWebhooks:
    certManager:
      enabled: true

# ---------------------------------------------------------------------------
# Default scrape jobs
# ---------------------------------------------------------------------------
# Talos hides the etcd / kube-controller-manager / kube-scheduler /
# kube-proxy bind addresses by default. Without a machineconfig patch to
# expose them, scraping them only produces TargetDown alerts. Disabling
# the chart's default ServiceMonitors for those components avoids the
# noise. To turn them back on, add the machineconfig patch (see the
# source homelab's `omni/cluster-template/cluster-template.yaml` for an
# example) and re-enable here.
kubelet:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeApiServer:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeDns:
  enabled: false
