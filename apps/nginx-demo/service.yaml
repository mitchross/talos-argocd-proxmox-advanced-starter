apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    # `name: http` is required for HTTPRoute attachment. Unnamed
    # Service ports silently fail to attach to HTTPRoutes — Cilium's
    # Gateway controller can't resolve `backendRefs[].port` against
    # an unnamed-port Service. This is the single most common silent-
    # failure in Gateway API setups; preserving the name as a starter
    # convention prevents future copy-paste-bugs.
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
