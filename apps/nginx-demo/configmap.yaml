---
# Custom index page so the demo serves something more useful than the
# stock nginx welcome screen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-demo-content
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>nginx-demo — talos-argocd-proxmox-advanced-starter</title>
      <style>
        body { font-family: system-ui, -apple-system, sans-serif;
               max-width: 720px; margin: 4em auto; padding: 0 1em;
               color: #222; line-height: 1.5; }
        h1 { color: #006064; }
        code { background: #eef; padding: 0 4px; border-radius: 3px; }
        a { color: #006064; }
      </style>
    </head>
    <body>
      <h1>nginx-demo is reachable through Cilium Gateway API ✅</h1>
      <p>
        You're hitting an <code>HTTPRoute</code> attached to the
        <code>gateway-internal</code> Gateway in the <code>gateway</code>
        namespace, which Cilium serves via L2 announcements on the LAN
        IP from <code>infrastructure/networking/cilium/ip-pool.yaml</code>.
        cert-manager's gateway-shim auto-issued a self-signed cert for
        the wildcard DNS pattern; that's why your browser showed a
        "self-signed cert" warning on first visit.
      </p>
      <p>
        Next steps in this starter — try the stateful-demo for the
        magic <code>backup: hourly</code> label pattern, or the
        postgres-demo for full database DR via CNPG-Barman.
      </p>
    </body>
    </html>
