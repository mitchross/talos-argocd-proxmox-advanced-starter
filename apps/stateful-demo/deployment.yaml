---
# Tiny stateful workload writing a timestamped line every 30 seconds
# to /data/heartbeat.log. The point is: you can `kubectl exec` into
# the pod, see the file growing, then verify pvc-plumber has wired up
# backups so that file is being snapshotted to NFS via Kopia.
#
# strategy: Recreate is MANDATORY because the volume is RWO Longhorn.
# RollingUpdate would try to start a new pod with the same PVC mounted
# while the old pod is still attached, which Longhorn refuses
# ("Multi-Attach error"). The new pod hangs in
# ContainerCreating until the deployment's old ReplicaSet scales to 0.
#
# This pattern bites every newcomer to RWO storage on Kubernetes —
# preserving as a teaching artifact.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateful-demo
  namespace: stateful-demo
  labels:
    app.kubernetes.io/name: stateful-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stateful-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stateful-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heartbeat
          # SHA digest pin (always-pin-sha rule, see .claude/rules/).
          # Renovate tracks tag + digest in lockstep.
          image: busybox:1.37@sha256:1487d0af5f52b4ba31c7e465126ee2123fe3f2305d638e7827681e7cf6c83d5e
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Write an initial line so the file exists immediately.
              echo "$(date -Iseconds) — stateful-demo starting on $(hostname)" >> /data/heartbeat.log
              # Then tick every 30s. Trap so SIGTERM → graceful exit.
              trap 'exit 0' TERM INT
              while :; do
                echo "$(date -Iseconds) — heartbeat from $(hostname)" >> /data/heartbeat.log
                sleep 30 &
                wait $!
              done
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stateful-demo-data
