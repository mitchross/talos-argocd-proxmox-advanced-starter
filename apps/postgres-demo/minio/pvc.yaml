---
# Persistent storage for MinIO. 10Gi on Longhorn — enough for ~weeks of
# postgres-demo backups at the default 6h schedule with 7-day retention.
#
# Backup: explicitly OFF (backup-exempt label per pvc-plumber v2.1
# contract) — the data ON this PVC is itself the backup target. We
# don't need pvc-plumber/Kopia to back up our backups.
#
# `storage.vanillax.dev/backup-exempt-reason: external-source` declares
# the intent: this PVC's contents ARE the database's external recovery
# source. Backing it up via the cluster's PVC-backup pipeline would be
# circular (you'd be backing up the database backups, then if you
# restore them you have to also restore where they live...).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: postgres-demo
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    backup-exempt: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    storage.vanillax.dev/backup-exempt-reason: external-source
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
