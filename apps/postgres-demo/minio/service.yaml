apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: postgres-demo
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    # `name: http-api` is consumed by:
    #   - the MinIO bootstrap Job (mc creates the cnpg-backups bucket)
    #   - the CNPG Barman ObjectStore CR (endpointURL points at this
    #     service; the plugin sidecar streams WAL + base backups here)
    # `name: http-console` is for users who port-forward and want to
    # poke at the MinIO web UI. Not exposed via HTTPRoute by default —
    # MinIO's default web UI has no auth gating beyond the access key,
    # and exposing it requires the same auth-proxy recipe as Longhorn.
    - name: http-api
      port: 9000
      targetPort: http-api
      protocol: TCP
    - name: http-console
      port: 9001
      targetPort: http-console
      protocol: TCP
