---
# Creates the `cnpg-backups` bucket in MinIO via `mc`.
#
# Idempotent: `mc mb -p` (parents + ignore-exists) is a no-op if the
# bucket already exists. ArgoCD hook annotations make this re-run
# cleanly on every sync — without `BeforeHookCreation`, K8s Jobs are
# immutable and image-tag bumps from Renovate would error with
# "field is immutable" on subsequent syncs.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-bootstrap
  namespace: postgres-demo
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: bucket-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: bucket-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ENDPOINT
              value: http://minio.postgres-demo.svc.cluster.local:9000
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ACCESS_KEY_ID
            - name: ACCESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ACCESS_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              # Wait until MinIO's health endpoint is responsive — the
              # MinIO Deployment is at the same sync-wave as this Job's
              # parent, but MinIO needs ~10s to actually serve.
              until mc alias set local "$MINIO_ENDPOINT" "$ACCESS_KEY_ID" "$ACCESS_SECRET_KEY"; do
                echo "MinIO not ready yet; retrying in 5s..."
                sleep 5
              done
              # Idempotent bucket creation. -p creates parents +
              # tolerates "already exists".
              mc mb -p local/cnpg-backups
              # Set a 30-day lifecycle on the bucket. CNPG's Barman
              # retentionPolicy ("7d") in objectstore.yaml controls
              # WAL/base backup retention; this bucket-level rule is a
              # belt-and-braces sweep for any orphaned objects.
              mc ilm rule add --expire-days 30 local/cnpg-backups || true
              echo "MinIO bucket cnpg-backups ready."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
