---
# Single-pod MinIO. Console on :9001, S3 API on :9000. Both Service
# ports are named (`http-api`, `http-console`) for HTTPRoute
# compatibility — even though we don't expose either externally in
# the default starter, the named-port convention prevents silent
# attachment failures if a user later adds an HTTPRoute.
#
# strategy: Recreate is mandatory because the volume is RWO Longhorn —
# RollingUpdate would try to start a new pod with the same PVC mounted
# while the old pod still has it, which Longhorn refuses (multi-attach
# deadlock).
#
# Resources: small. Single pod, single client (CNPG plugin's barman-cloud
# sidecar). Bump if you start storing more than postgres-demo's backups
# in this MinIO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: postgres-demo
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: http-api
              containerPort: 9000
              protocol: TCP
            - name: http-console
              containerPort: 9001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: http-api
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
