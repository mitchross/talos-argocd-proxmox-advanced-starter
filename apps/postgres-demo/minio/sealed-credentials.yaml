# =============================================================================
# PLACEHOLDER — replace before postgres-demo first reconciles.
# =============================================================================
#
# In-cluster MinIO admin credentials, also used as S3 access keys for the
# CNPG Barman ObjectStore. One Secret with four key/value pairs:
#
#   ACCESS_KEY_ID         — used as MinIO root user AND S3 access key
#   ACCESS_SECRET_KEY     — used as MinIO root password AND S3 secret key
#   MINIO_ROOT_USER       — same value as ACCESS_KEY_ID (MinIO env contract)
#   MINIO_ROOT_PASSWORD   — same value as ACCESS_SECRET_KEY (MinIO env contract)
#
# Why duplicate? MinIO's container reads `MINIO_ROOT_USER` /
# `MINIO_ROOT_PASSWORD` from env (set in deployment.yaml). The CNPG
# Barman ObjectStore reads `ACCESS_KEY_ID` / `ACCESS_SECRET_KEY` keys
# from the same Secret. Different consumers expect different key names;
# one Secret with both names keeps the credential single-sourced.
#
# To create the real SealedSecret:
#   1. Verify the cluster is up + sealed-secrets controller is Running
#      (`kubectl get pods -n sealed-secrets`).
#   2. From the repo root:
#         ./scripts/seal-secret.sh apps/postgres-demo/minio/sealed-credentials.yaml
#      The script generates two random 24-byte values (one for the
#      access key, one for the secret), kubeseal-s the resulting Secret
#      against the cluster's public key, and overwrites this file with
#      a SealedSecret.
#   3. Commit + push. ArgoCD picks up the new file, the sealed-secrets
#      controller unwraps it into Secret/minio-credentials in
#      postgres-demo, and MinIO's Deployment + the CNPG ObjectStore CR
#      both resolve their credential refs.
#
# Until you run seal-secret.sh, the manifest below is a STUB regular
# Secret with placeholder values. **DO NOT use this in production**:
# the seal-secret.sh step is mandatory.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: postgres-demo
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  ACCESS_KEY_ID: "REPLACE_ME_VIA_SEAL_SECRET_SH"
  ACCESS_SECRET_KEY: "REPLACE_ME_VIA_SEAL_SECRET_SH"
  MINIO_ROOT_USER: "REPLACE_ME_VIA_SEAL_SECRET_SH"
  MINIO_ROOT_PASSWORD: "REPLACE_ME_VIA_SEAL_SECRET_SH"
