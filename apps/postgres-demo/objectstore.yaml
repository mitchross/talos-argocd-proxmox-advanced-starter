---
# CNPG-Barman ObjectStore — declares the S3 destination for WAL
# archiving + base backups. The Cluster CR (in base/cluster.yaml)
# references this ObjectStore by name via its `plugins[].parameters.
# barmanObjectName` field.
#
# Endpoint:
#   In-cluster MinIO Service (apps/postgres-demo/minio/service.yaml).
#   `cluster.local` suffix is required — Talos's CoreDNS resolves
#   short names from the pod's namespace by default, but explicit FQDN
#   is more robust during initial bootstrap when DNS search domains
#   may not yet be programmed in the database pod.
#
# Retention:
#   `7d` — every backup older than 7 days is reaped. Combined with the
#   ScheduledBackup running every 6h, that's ~28 base backups on disk
#   plus their associated WAL chains.
#
# To swap MinIO for a real S3 (AWS, R2, Backblaze, external MinIO):
#   See docs/extending/external-s3-backend.md (Phase 3 recipe). The only
#   files that change are this ObjectStore (endpointURL + bucket) and
#   the SealedSecret in minio/ (credentials for the new backend).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-demo-backups
  namespace: postgres-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  configuration:
    destinationPath: s3://cnpg-backups
    endpointURL: http://minio.postgres-demo.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: minio-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "7d"
