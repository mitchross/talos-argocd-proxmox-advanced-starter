---
# Default bootstrap — creates a fresh `demo` database owned by the
# `demoapp` role on first install. The role's password is generated by
# CNPG (it creates a Secret named `<cluster>-app` with username +
# password keys; consume via secretKeyRef, don't try to seal a
# pre-known password).
#
# postInitApplicationSQL runs once on the empty database. The starter
# adds a single demo table so users can `kubectl exec` and see real
# data flowing through the backup → restore pipeline.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-demo
spec:
  bootstrap:
    initdb:
      database: demo
      owner: demoapp
      postInitApplicationSQL:
        - CREATE TABLE IF NOT EXISTS guestbook (id SERIAL PRIMARY KEY, message TEXT NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now());
        - INSERT INTO guestbook (message) VALUES ('First entry — created at initdb time.');
        - GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "demoapp";
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "demoapp";
