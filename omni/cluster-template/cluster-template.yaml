# ==============================================================================
# omnictl cluster template sync -v -f cluster-template.yaml
# ==============================================================================
# Cluster spec for the starter homelab cluster: 1 control plane + 2 workers,
# no GPU node, no Cloudflare integration. Total footprint ~56 GB RAM /
# 20 vCPU — fits on a single 64GB Proxmox host. To upgrade to 3 CP +
# N workers HA, bump `cluster.controlplanes` count to 3 and re-run
# `omnictl cluster template sync` against this file.
#
# Why a single CP? This is a starter, not a production cluster. A single
# CP is fine for learning and for the demos in this repo. ArgoCD,
# AppSets, the pvc-plumber operator, Longhorn — none of them require an
# HA control plane to function. When you're ready for production, add
# two more CPs (size: 3) and re-run `omnictl cluster template sync`.
#
# Why is the CP untainted? Longhorn defaults to a 2-replica
# StorageClass; with 2 worker nodes that's already enough, but having
# the CP available as a third storage candidate is cheap insurance.
# `allowSchedulingOnControlPlanes: true` removes the NoSchedule taint
# Talos applies by default. If you scale to 3 CPs later, you'll
# probably want to flip this back to false (HA control planes
# shouldn't accept arbitrary workloads).
#
# After applying this template, Omni will provision the VMs in Proxmox
# via the infrastructure provider, install Talos, and assemble the
# cluster.
#
# Critical Talos 1.13 detail — `install-disk` patch is mandatory.
# Talos 1.13 replaced the old install/upgrade flow with the LifecycleService
# API, which requires an explicit install.disk in the machine config. Without
# this patch, fresh VMs boot but control planes get stuck in
# stage=7 (UPGRADING) with `configuptodate=false` forever — no error
# surfaces, the cluster simply never bootstraps. virtio-scsi-single + scsi0
# (the provider default) presents as /dev/sda in all machine classes, so
# this is safe at cluster scope.
---
kind: Cluster
name: homelab
labels:
  cluster-id: "1"
kubernetes:
  version: v1.36.2
talos:
  version: v1.13.4
patches:
  - name: disable-default-cni
    inline:
      cluster:
        network:
          cni:
            name: none
        proxy:
          disabled: true
  - name: dns-resolver
    # Substitute your LAN nameservers if you don't use the gateway as your
    # DNS server. Pi-hole, AdGuardHome, and Firewalla all live on the
    # gateway IP in typical homelabs.
    inline:
      apiVersion: v1alpha1
      kind: ResolverConfig
      nameservers:
        - address: 1.1.1.1
        - address: 8.8.8.8
  - name: install-disk
    # MANDATORY on Talos 1.13+. See the doc-block at the top of this file
    # for context. Don't remove this even if your machine class uses a
    # different disk presentation — override per-machineset instead.
    inline:
      machine:
        install:
          disk: /dev/sda
  - name: allow-scheduling-on-control-planes
    # Untaint the control plane so workloads (specifically: Longhorn's
    # storage replicas) can land there. Safe for a single-CP starter; flip
    # back to false when you scale to 3 CPs for HA.
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
---
kind: ControlPlane
machineClass:
  name: proxmox-control-plane
  size: 1
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfs-utils
  - siderolabs/nfsrahead
  # qemu-guest-agent auto-installed by the Proxmox provider — no extension needed.
  - siderolabs/util-linux-tools
---
kind: Workers
name: workers
machineClass:
  name: proxmox-worker
  size: 2
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfs-utils
  - siderolabs/nfsrahead
  - siderolabs/util-linux-tools
patches:
  - name: longhorn-storage
    # Longhorn requires /var/lib/longhorn to be a host-path mount with the
    # `rshared` propagation flag so its CSI driver can publish volumes into
    # pods. The bind here makes /var/local/longhorn (a writable Talos host
    # path) appear at /var/lib/longhorn inside the kubelet's view.
    #
    # If you're using a multi-disk worker (separate disk for Longhorn data),
    # see docs/extending/ for the right shape — you'd swap the bind mount
    # for an actual filesystem mount.
    inline:
      machine:
        kubelet:
          nodeIP:
            validSubnets:
              - __REPLACE_ME_NODE_CIDR__
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/local/longhorn
              options:
                - bind
                - rshared
                - rw
