services:
  omni-infra-provider-proxmox:
    # Upstream image — this starter doesn't depend on the local-build features
    # the source homelab uses (multi-disk, GPU PCI mappings, etc.). If you
    # need those, swap to the local-build image and see
    # `docs/extending/adding-gpu-support.md`.
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:latest
    container_name: omni-infra-provider-proxmox
    env_file:
      - .env
    volumes:
      - ./config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY}
    restart: unless-stopped
    network_mode: host
