services:
  omni-infra-provider-proxmox:
    # Upstream v0.2 includes multi-disk, additional-NIC, PCI mapping, and
    # Proxmox 9 HA fields. The base machine classes keep those optional; see
    # ../../docs/extending/ for worked additions.
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0@sha256:c0d0687e87d9f2fb77c7a9d6d7263820953d20441200f3de64b22afaa7ff273e
    container_name: omni-infra-provider-proxmox
    env_file:
      - .env
    volumes:
      - ./config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY}
    restart: unless-stopped
    network_mode: host
