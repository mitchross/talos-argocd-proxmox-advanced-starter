---
# Apply with: omnictl apply -f control-plane.yaml
#
# Control-plane VM specs. 4 cores, 8 GB RAM, 60 GB disk is plenty for a
# single-CP starter. Etcd is latency-sensitive so prefer SSD/NVMe storage
# if available — the disk_* tunables below are set up to take advantage
# of either.
#
# When you scale to a 3-CP HA cluster (see docs/extending/scaling-to-ha.md),
# bump memory to 16000 — the bigger etcd quorum benefits from headroom.
#
# storage_selector uses CEL — see the upstream README for the full grammar:
#   https://github.com/siderolabs/omni-infra-provider-proxmox
# `name == "<pool>"` is the simplest form; substitute your pool below.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: proxmox-control-plane
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox
    kernelargs: []
    metavalues: []
    providerdata: |
      cores: 4
      sockets: 1
      memory: 8000
      disk_size: 60
      network_bridge: vmbr0
      storage_selector: name == "__REPLACE_ME_PROXMOX_STORAGE_POOL__"
      # Disk performance — safe defaults for SSD/NVMe-backed pools.
      # If you're on spinning disk, drop disk_aio to "threads" or omit.
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
