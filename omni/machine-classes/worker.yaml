---
# Apply with: omnictl apply -f worker.yaml
#
# General-purpose worker VM specs. 8 cores, 24 GB RAM, 200 GB disk per
# worker. With 2 workers (the starter default), that's 48 GB RAM /
# 16 vCPU for workloads — comfortably fits the GitOps stack, monitoring,
# and the three demo apps with room to spare.
#
# Bump cores/memory/disk_size before applying if you plan to run heavier
# real workloads on top.
#
# This starter ships single-NIC workers. If you have a separate storage
# network (10G NIC to TrueNAS over vmbr1, etc.), see
#   ../../docs/extending/additional-nics.md
# for the additional_nics pattern.
#
# Multi-disk workers (separate disk for /var/lib/longhorn, etc.) and GPU
# workers also have recipes under ../../docs/extending/.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: proxmox-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox
    kernelargs: []
    metavalues: []
    providerdata: |
      cores: 8
      sockets: 1
      memory: 24000
      disk_size: 200
      network_bridge: vmbr0
      storage_selector: name == "__REPLACE_ME_PROXMOX_STORAGE_POOL__"
      # Disk performance — safe defaults for SSD/NVMe-backed pools.
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
